<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>cover art</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}

.deck{display:grid;gap:7px;justify-content:center;margin:8px auto;max-width:100%}
.card{
  aspect-ratio:3/4;min-width:0;border-radius:9px;border:1px solid var(--line);
  background:#262431;cursor:pointer;position:relative;perspective:600px;padding:0;
}
.card .inner{position:absolute;inset:0;transition:transform .32s;transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;
  border-radius:8px;overflow:hidden}
.back{background:linear-gradient(135deg,#2c2a38,#1d1c26);color:#4d4a60;font:700 1.5rem var(--mono)}
.front{background:#f2efe6;color:#14131a;transform:rotateY(180deg);font:700 .8rem var(--sans);
  line-height:1.25;padding:6px;text-align:center;word-break:break-word}
.front.pic{padding:0}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.card.done{opacity:.5}
/* A tint would be hidden by the photograph, so a matched card is ringed instead. */
.card.done .front{box-shadow:inset 0 0 0 3px var(--ok)}
.creds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.creds li{display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--dim)}
.creds img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:0 0 auto;
  border:1px solid var(--line)}
.creds b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> cover art</h1>
<div class="sub">Find the matching covers</div></header>

<div class="panel">
  <div class="scoreline">turns <span id="turns">0</span> · pairs <span id="pairs">0</span> · best <span id="best">-</span></div>
  <div class="deck" id="deck"></div>
  <div class="row" style="margin-top:12px">
    <button id="again">Deal again</button>
    <span class="note" id="status"></span>
  </div>
</div>
<div class="panel hidden" id="credsPanel">
  <h2>Pictures</h2>
  <ol class="creds" id="creds"></ol>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>

  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }

const AudioKit = (() => {
  let ctx = null;
  const NOTES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** "A4" | "F#3" -> Hz. Returns 0 for a rest. */
  function freq(note){
    if (!note || note === 'r' || note === 'R') return 0;
    const m = String(note).match(/^([A-Ga-g])([#b]?)(-?\d)$/);
    if (!m) return 0;
    const semi = NOTES[m[1].toUpperCase() + m[2]];
    if (semi === undefined) return 0;
    return 440 * Math.pow(2, (semi - 9) / 12 + (Number(m[3]) - 4));
  }

  /** One note. type: square | triangle | sawtooth | sine */
  function beep(note, dur, opts){
    const c = ac(); if (!c) return;
    const o = opts || {};
    const f = typeof note === 'number' ? note : freq(note);
    if (!f) return;
    const t = c.currentTime;
    const d = dur || 0.18;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


const PAIRS = DATA.pairs || [];
const bestStore = store('mempix:' + DATA.title);
let flipped = [], turns = 0, matched = 0, lock = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function labelFor(p, i){ return p.cap || ('Picture ' + (i + 1)); }

function deal(){
  turns = 0; matched = 0; flipped = []; lock = false;
  const cards = [];
  PAIRS.forEach((p, i) => {
    const name = labelFor(p, i);
    cards.push({ key: i, pic: p.img, name: name });
    if (DATA.mode === 'caption') cards.push({ key: i, text: p.cap, name: p.cap });
    else cards.push({ key: i, pic: p.img, name: name });
  });
  shuffle(cards);
  // The board wants to be square, and is allowed to be as wide as the screen
  // genuinely holds: a hard column cap would turn fifty pairs into a column of
  // a hundred cards. MIN_CARD is the floor below which a picture stops reading;
  // the tracks themselves shrink to fit, so a phone lays the same board out
  // narrower and taller rather than overflowing sideways.
  const MIN_CARD = 54, GAP = 7, MAX_CARD = 118;
  const room = Math.min(window.innerWidth, 1100) - 44;
  const fits = Math.max(2, Math.floor((room + GAP) / (MIN_CARD + GAP)));
  const cols = Math.min(fits, Math.ceil(Math.sqrt(cards.length)));
  const deck = $('#deck');
  deck.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, ' + MAX_CARD + 'px))';
  deck.replaceChildren();
  cards.forEach(c => {
    const b = document.createElement('button');
    b.className = 'card';
    b.type = 'button';
    b.dataset.key = c.key;
    b.dataset.name = c.name || 'Card';
    b.setAttribute('aria-label', 'Face-down card');
    if (c.pic){
      b.innerHTML = '<span class="inner"><span class="face back">?</span>'
        + '<span class="face front pic"><img alt=""></span></span>';
      // The src is assigned rather than interpolated: a data URI is long and
      // does not want to go through HTML escaping twice.
      b.querySelector('img').src = c.pic;
    } else {
      b.innerHTML = '<span class="inner"><span class="face back">?</span>'
        + '<span class="face front">' + esc(c.text || '') + '</span></span>';
    }
    b.addEventListener('click', () => flip(b));
    deck.appendChild(b);
  });
  paint();
}

function flip(b){
  if (lock || b.classList.contains('up') || b.classList.contains('done')) return;
  b.classList.add('up');
  b.setAttribute('aria-label', b.dataset.name);
  flipped.push(b);
  if (typeof AudioKit !== 'undefined') AudioKit.sfx.click();
  if (flipped.length < 2) return;
  turns++;
  lock = true;
  const a = flipped[0], c = flipped[1];
  if (a.dataset.key === c.dataset.key){
    a.classList.add('done'); c.classList.add('done');
    matched++;
    flipped = []; lock = false;
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.good();
    paint();
  } else {
    // A correct match resolves at once; only a miss waits.
    setTimeout(() => {
      a.classList.remove('up'); c.classList.remove('up');
      a.setAttribute('aria-label', 'Face-down card');
      c.setAttribute('aria-label', 'Face-down card');
      flipped = []; lock = false;
      paint();
    }, 880);
    paint();
  }
}

function paint(){
  $('#turns').textContent = turns;
  $('#pairs').textContent = matched + ' of ' + PAIRS.length;
  const b = bestStore.get(null);
  $('#best').textContent = b === null ? '-' : b + ' turns';
  if (matched === PAIRS.length){
    const prev = bestStore.get(null);
    if (prev === null || turns < prev) bestStore.set(turns);
    $('#status').textContent = 'Cleared in ' + turns + ' turns'
      + (prev !== null && turns < prev ? ' - a new best.' : '.');
    $('#status').className = 'note ok';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.win();
  } else {
    $('#status').textContent = '';
  }
}

/**
 * Attribution lives in one list at the foot, with a thumbnail, because the
 * cards are shuffled and a credit that only says "picture 3" identifies
 * nothing. The panel stays hidden when nobody needed crediting.
 */
function credits(){
  const rows = PAIRS.map((p, i) => ({ img: p.img, label: labelFor(p, i), credit: p.credit }))
    .filter(r => r.credit);
  if (!rows.length) return;
  const ol = $('#creds');
  rows.forEach(r => {
    const li = document.createElement('li');
    const im = document.createElement('img');
    im.alt = '';
    im.src = r.img;
    const span = document.createElement('span');
    span.innerHTML = '<b>' + esc(r.label) + '</b> - ' + esc(r.credit);
    li.appendChild(im); li.appendChild(span);
    ol.appendChild(li);
  });
  $('#credsPanel').classList.remove('hidden');
}

$('#again').addEventListener('click', deal);
credits();
deal();

</script>
