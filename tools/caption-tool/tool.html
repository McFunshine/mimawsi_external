<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<meta charset="utf-8">
<title>Caption</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --ink: inherit; }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    margin: 0; padding: 1.5rem 1rem 3rem;
    max-width: 48rem; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .lede { opacity: .75; margin: 0 0 1.25rem; }

  .drop {
    border: 2px dashed var(--line); border-radius: 10px;
    padding: 2rem 1rem; text-align: center; cursor: pointer;
  }
  .drop.over { border-style: solid; }
  .drop input { display: none; }

  .stage { margin: 1rem 0; display: none; }
  .stage.ready { display: block; }
  canvas {
    max-width: 100%; height: auto; display: block;
    border: 1px solid var(--line); border-radius: 8px;
    touch-action: none; cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 1rem 0; padding: .75rem 1rem 1rem; }
  legend { padding: 0 .35rem; font-size: .85rem; opacity: .8; }
  label { display: block; font-size: .9rem; margin-top: .6rem; }
  textarea, input[type=text], select {
    font: inherit; width: 100%; padding: .45rem;
    border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: inherit;
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  .grid { display: grid; gap: .75rem 1rem; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
  .inline { display: flex; align-items: center; gap: .5rem; }
  input[type=range] { width: 100%; }
  input[type=color] { width: 2.75rem; height: 2rem; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  button {
    font: inherit; padding: .5rem 1.1rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer;
  }
  button.primary { border-color: currentColor; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: .85rem; opacity: .7; margin: .5rem 0 0; }
  .place { display: flex; gap: .35rem; flex-wrap: wrap; }
  .place button { padding: .3rem .7rem; font-size: .85rem; }
  .place button[aria-pressed=true] { border-color: currentColor; font-weight: 600; }
</style>
</head>
<body>
  <h1>Caption</h1>
  <p class="lede">Put words on a picture. The picture never leaves this page — it is
  read by your own browser and drawn on a canvas here, so nothing is uploaded anywhere.</p>

  <label class="drop" id="drop" for="file">
    <strong>Choose an image</strong>, or drop one here.
    <input id="file" type="file" accept="image/*">
  </label>

  <div class="stage" id="stage">
    <canvas id="canvas" aria-label="Your image with the caption drawn on it"></canvas>
    <p class="hint" id="hint">Drag the text to move it. Arrow keys nudge it once the canvas has focus.</p>

    <fieldset>
      <legend>The words</legend>
      <label for="words">Caption — one line each</label>
      <textarea id="words" spellcheck="false">ONE DOES NOT SIMPLY
WRITE A CAPTION</textarea>

      <div class="place" role="group" aria-label="Put the text">
        <button type="button" data-at="top">Top</button>
        <button type="button" data-at="middle">Middle</button>
        <button type="button" data-at="bottom" aria-pressed="true">Bottom</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>How it looks</legend>
      <div class="grid">
        <div>
          <label for="face">Typeface</label>
          <select id="face">
            <option value="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif">Impact</option>
            <option value="system-ui, sans-serif">System</option>
            <option value="Georgia, 'Times New Roman', serif">Serif</option>
            <option value="'Courier New', monospace">Monospace</option>
          </select>
        </div>
        <div>
          <label for="size">Size <span id="sizeOut">8%</span></label>
          <input id="size" type="range" min="2" max="20" step="0.5" value="8">
        </div>
        <div>
          <label for="fill" class="inline">Text <input id="fill" type="color" value="#ffffff"></label>
          <label for="edge" class="inline">Outline <input id="edge" type="color" value="#000000"></label>
        </div>
        <div>
          <label for="thickness">Outline <span id="thickOut">14%</span></label>
          <input id="thickness" type="range" min="0" max="30" step="1" value="14">
        </div>
      </div>
      <label class="inline" style="margin-top:.9rem">
        <input id="caps" type="checkbox" checked=""> Shout it in capitals
      </label>
    </fieldset>

    <div class="row">
      <button class="primary" id="save" type="button">Save the picture</button>
      <button id="reset" type="button">Start again</button>
    </div>
    <p class="hint" id="note"></p>
  </div>

<script>
  var drop = document.getElementById('drop');
  var file = document.getElementById('file');
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var words = document.getElementById('words');
  var face = document.getElementById('face');
  var size = document.getElementById('size');
  var sizeOut = document.getElementById('sizeOut');
  var thickness = document.getElementById('thickness');
  var thickOut = document.getElementById('thickOut');
  var fill = document.getElementById('fill');
  var edge = document.getElementById('edge');
  var caps = document.getElementById('caps');
  var note = document.getElementById('note');
  var hint = document.getElementById('hint');

  // The picture, once one has been chosen, and where the text sits on it as a
  // fraction of width and height. Fractions rather than pixels so the position
  // survives the canvas being displayed at a different scale to its real size.
  var picture = null;
  var at = { x: 0.5, y: 0.88 };
  var placedBy = 'bottom';

  var PLACES = { top: 0.14, middle: 0.5, bottom: 0.88 };

  function say(message) { note.textContent = message || ''; }

  function draw() {
    if (!picture) { return; }

    canvas.width = picture.naturalWidth;
    canvas.height = picture.naturalHeight;
    ctx.drawImage(picture, 0, 0);

    var lines = words.value.split('\n').filter(function (line) { return line.trim() !== ''; });
    if (lines.length === 0) { return; }
    if (caps.checked) {
      lines = lines.map(function (line) { return line.toUpperCase(); });
    }

    // Sized against the smaller edge, so a caption on a tall photograph is not
    // hugely bigger than the same caption on a wide one.
    var basis = Math.min(canvas.width, canvas.height);
    var px = (Number(size.value) / 100) * basis;
    var step = px * 1.15;

    ctx.font = '700 ' + px + 'px ' + face.value;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.fillStyle = fill.value;
    ctx.strokeStyle = edge.value;
    ctx.lineWidth = px * (Number(thickness.value) / 100);

    var x = at.x * canvas.width;
    // The block is centred on the handle, so dragging moves all the lines together
    // rather than pinning the first one and letting the rest hang below the image.
    var first = at.y * canvas.height - ((lines.length - 1) * step) / 2;

    lines.forEach(function (line, i) {
      var y = first + i * step;
      // Stroke under fill. The other order draws the outline on top of the letters
      // and eats into them, which is what makes home-made captions look thin.
      if (ctx.lineWidth > 0) { ctx.strokeText(line, x, y); }
      ctx.fillText(line, x, y);
    });
  }

  function load(chosen) {
    if (!chosen) { return; }
    if (chosen.type.indexOf('image/') !== 0) {
      say('That is not an image, so there is nothing to caption.');
      return;
    }

    var reader = new FileReader();
    reader.onerror = function () { say('That file could not be read.'); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () {
        say('That looked like an image but the browser could not decode it.');
      };
      img.onload = function () {
        picture = img;
        stage.classList.add('ready');
        say('');
        draw();
      };
      // A data URL, read by this page from a file you chose. The policy this tool
      // runs under permits data: images and no remote ones at all.
      img.src = reader.result;
    };
    reader.readAsDataURL(chosen);
  }

  file.addEventListener('change', function () { load(file.files[0]); });

  ['dragenter', 'dragover'].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      drop.classList.remove('over');
      if (name === 'drop' && e.dataTransfer) { load(e.dataTransfer.files[0]); }
    });
  });

  [words, face, size, thickness, fill, edge, caps].forEach(function (el) {
    el.addEventListener('input', function () {
      sizeOut.textContent = size.value + '%';
      thickOut.textContent = thickness.value + '%';
      draw();
    });
    el.addEventListener('change', draw);
  });

  var placers = document.querySelectorAll('.place button');
  Array.prototype.forEach.call(placers, function (button) {
    button.addEventListener('click', function () {
      placedBy = button.getAttribute('data-at');
      at.x = 0.5;
      at.y = PLACES[placedBy];
      Array.prototype.forEach.call(placers, function (other) {
        other.setAttribute('aria-pressed', String(other === button));
      });
      draw();
    });
  });

  // Dragging. Pointer events rather than mouse events, so a finger on a phone and
  // a mouse on a desktop take the same path through this and there is only one to
  // get right.
  var dragging = false;
  function place(e) {
    var box = canvas.getBoundingClientRect();
    at.x = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    at.y = Math.min(1, Math.max(0, (e.clientY - box.top) / box.height));
    draw();
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (!picture) { return; }
    dragging = true;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
    place(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) { place(e); }
  });
  ['pointerup', 'pointercancel'].forEach(function (name) {
    canvas.addEventListener(name, function () {
      dragging = false;
      canvas.classList.remove('dragging');
    });
  });

  // Nudging, because dragging to the exact middle of something is harder than it
  // looks and a caption one pixel off centre is the thing you notice afterwards.
  canvas.tabIndex = 0;
  canvas.addEventListener('keydown', function (e) {
    var by = e.shiftKey ? 0.05 : 0.005;
    var moves = { ArrowLeft: [-by, 0], ArrowRight: [by, 0], ArrowUp: [0, -by], ArrowDown: [0, by] };
    var move = moves[e.key];
    if (!move) { return; }
    e.preventDefault();
    at.x = Math.min(1, Math.max(0, at.x + move[0]));
    at.y = Math.min(1, Math.max(0, at.y + move[1]));
    draw();
  });

  document.getElementById('save').addEventListener('click', function () {
    if (!picture) { return; }
    var link = document.createElement('a');
    link.download = 'caption.png';
    // Straight off the canvas. Nothing is sent anywhere to produce this; the
    // finished picture is assembled in the page and handed to the browser.
    link.href = canvas.toDataURL('image/png');
    link.click();
    say('Saved as caption.png.');
  });

  document.getElementById('reset').addEventListener('click', function () {
    picture = null;
    file.value = '';
    stage.classList.remove('ready');
    at = { x: 0.5, y: PLACES.bottom };
    say('');
  });

  hint.textContent = 'Drag the text to move it. Arrow keys nudge it once the canvas has focus; hold shift to move further.';
</script>


</body></html>
