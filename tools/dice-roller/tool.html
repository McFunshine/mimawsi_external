<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<meta charset="utf-8">
<title>Dice Roller</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 22rem; text-align: center; }
  .dice { font-size: 4rem; letter-spacing: .5rem; margin: 1rem 0; min-height: 4.5rem; }
  button { font: inherit; padding: .6rem 1.4rem; border-radius: .4rem; border: 1px solid #999; cursor: pointer; }
  label { display: block; margin: 1rem 0; }
  input { font: inherit; width: 3.5rem; }
</style>
</head>
<body>
  <h1>Dice Roller</h1>
  <label>How many dice? <input id="count" type="number" value="2" min="1" max="6"></label>
  <div class="dice" id="dice">⚀ ⚀</div>
  <button id="roll">Roll</button>
  <p id="total"></p>
<script>
  var FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  function roll() {
    var n = Math.min(6, Math.max(1, Number(document.getElementById('count').value) || 1));
    var values = [];
    for (var i = 0; i < n; i++) values.push(1 + Math.floor(Math.random() * 6));
    document.getElementById('dice').textContent = values.map(function (v) { return FACES[v - 1]; }).join(' ');
    document.getElementById('total').textContent = 'Total: ' + values.reduce(function (a, b) { return a + b; }, 0);
  }
  document.getElementById('roll').addEventListener('click', roll);
  roll();
</script>


</body></html>
