// ---------------------------------------------------------------- constants

const FLOOR_Y = 606;               // top of the floorboards

  ink:       '#3a2c22',
};

// ---------------------------------------------------------------- canvas
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize() {
  const pad = 0;
  const availW = window.innerWidth - pad, availH = window.innerHeight - pad;
  scale = Math.min(availW / W, availH / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width  = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- state
const STATE = { TITLE: 0, PLAYING: 1, DYING: 2, OVER: 3 };
let state = STATE.TITLE;

let cat, walls, eddie, score, best, elapsed, dist, spawnX, shake, deathReason;

best = (() => {
  try { return parseInt(localStorage.getItem('pamuk-flap-best') || '0', 10) || 0; }
  catch (e) { return 0; }
})();

function reset(demo) {
  cat = { x: 118, y: H * 0.40, vy: 0, rot: 0, legKick: 0 };
  walls = [];
  eddie = { x: W + 120, speed: 42 };
  score = 0;
  elapsed = 0;
  dist = 0;
  shake = 0;
  deathReason = '';
  spawnX = W + 90;
  for (let i = 0; i < 4; i++) { walls.push(makeWall(spawnX)); spawnX += SPACING; }
  if (demo) {
    // one wall parked on screen so the title screen shows what a flap looks like
    const d = makeWall(268);
    d.holes = [{ cy: 372, gap: GAP_0, theta: 0, omega: 0, breeze: 0 }];
    walls.unshift(d);
  }
}

function speedNow() {
  return Math.min(SPEED_MAX, SPEED_0 + score * 3.1);
}
function gapNow() {
  return Math.max(GAP_MIN, GAP_0 - score * 2.4);
}

// A wall is a slab from ceiling to floor with one or two flap-shaped holes cut
// out of it. The flap itself is NOT solid — that is the whole point of a cat
// flap — so collision only ever tests the masonry.
function makeWall(x) {
  const gap = gapNow();
  const margin = 54;
  const lo = margin + gap / 2, hi = FLOOR_Y - margin - gap / 2;

  const double = score >= DOUBLE_FROM && Math.random() < 0.34;
  let holes;

  if (double) {
    // one high, one low, far enough apart that the masonry between them reads
    const span = hi - lo;
    const a = lo + span * (0.02 + Math.random() * 0.13);
    const b = hi - span * (0.02 + Math.random() * 0.13);
    holes = [a, b].map(cy => ({ cy, gap: gap * 0.92 }));
  } else {
    holes = [{ cy: lo + Math.random() * (hi - lo), gap }];
  }

  return {
    x,
    holes: holes.map(h => ({
      cy: h.cy,
      gap: h.gap,
      theta: 0,          // flap angle from hanging-straight-down, radians
      omega: 0,          // angular velocity
      breeze: Math.random() * Math.PI * 2,
    })),
    scored: false,
  };
}

// ---------------------------------------------------------------- input
function tap() {
  if (state === STATE.TITLE) {
    reset();
    state = STATE.PLAYING;
    cat.vy = FLAP_KICK;
    cat.legKick = 1;
  } else if (state === STATE.PLAYING) {
    cat.vy = FLAP_KICK;
    cat.legKick = 1;
  } else if (state === STATE.OVER) {
    state = STATE.TITLE;
  }
  // STATE.DYING ignores input — let him land.
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
    e.preventDefault();
    tap();
  }
});

// ---------------------------------------------------------------- update
function update(dt) {
  if (state === STATE.TITLE) {
    // Pamuk hovers on the title, bobbing, so he is never a still image,
    // and the demo flap ticks in the draught so you can see it is loose.
    elapsed += dt;
    updateFlaps(dt, 0);
    return;
  }

  elapsed += dt;
  dist += speedNow() * dt;
  shake = Math.max(0, shake - dt * 4);

  cat.vy = Math.min(MAX_FALL, cat.vy + GRAVITY * dt);
  cat.y += cat.vy * dt;
  cat.legKick = Math.max(0, cat.legKick - dt * 4.5);

  // Nose up when rising, tip forward on the way down — the classic tell.
  const target = Math.max(-0.42, Math.min(1.15, cat.vy / 620));
  cat.rot += (target - cat.rot) * Math.min(1, dt * 11);

  if (state === STATE.DYING) {
    if (cat.y + HIT_RY >= FLOOR_Y) {
      cat.y = FLOOR_Y - HIT_RY;
      state = STATE.OVER;
      if (score > best) {
        best = score;
        try { localStorage.setItem('pamuk-flap-best', String(best)); } catch (e) {}
      }
    }
    updateFlaps(dt, 0);
    return;
  }

  const v = speedNow();

  for (const w of walls) w.x -= v * dt;

  while (walls.length && walls[0].x + WALL_W < -20) walls.shift();
  while (walls.length < 5) {
    const lastX = walls.length ? walls[walls.length - 1].x : W;
    walls.push(makeWall(lastX + SPACING));
  }

  updateFlaps(dt, v);

  // Eddie trundles along the floorboards, minding his own business.
  eddie.x -= (v * 0.55 + eddie.speed) * dt;
  if (eddie.x < -160) eddie.x = W + 200 + Math.random() * 900;

  // --- collisions -------------------------------------------------------
  if (cat.y - HIT_RY <= CEILING_Y) { cat.y = CEILING_Y + HIT_RY; cat.vy = 60; }

  if (cat.y + HIT_RY >= FLOOR_Y) {
    cat.y = FLOOR_Y - HIT_RY;
    die('the floorboards');
    return;
  }

  for (const w of walls) {
    const overlapX = cat.x + HIT_RX > w.x && cat.x - HIT_RX < w.x + WALL_W;
    if (overlapX) {
      let through = false;
      for (const h of w.holes) {
        if (cat.y - HIT_RY > h.cy - h.gap / 2 && cat.y + HIT_RY < h.cy + h.gap / 2) {
          through = true;
        }
      }
      if (!through) { die('the wall'); return; }
    }
    if (!w.scored && w.x + WALL_W < cat.x - HIT_RX) {
      w.scored = true;
      score++;
    }
  }
}

// The flaps swing as a damped pendulum about their top hinge. A draught from
// the open back door keeps them ticking over even when nothing touches them.
function updateFlaps(dt, v) {
  for (const w of walls) {
    for (const h of w.holes) {
      h.breeze += dt * 1.7;

      const catInside =
        state === STATE.PLAYING &&
        cat.x + HIT_RX > w.x - 8 && cat.x - HIT_RX < w.x + WALL_W + 8 &&
        cat.y > h.cy - h.gap / 2 && cat.y < h.cy + h.gap / 2;

      if (catInside && h.omega < 7) h.omega = 8.6;

      const restoring = -13 * Math.sin(h.theta);
      const damping = -2.3 * h.omega;
      const draught = Math.sin(h.breeze) * 0.9 + (v > 0 ? 0.35 : 0);
      h.omega += (restoring + damping + draught) * dt;
      h.theta += h.omega * dt;

      // it can slam the other way a little, but not fold back through the wall
      if (h.theta < -0.34) { h.theta = -0.34; h.omega = Math.abs(h.omega) * 0.35; }
      if (h.theta > 1.02)  { h.theta = 1.02;  h.omega = -Math.abs(h.omega) * 0.4; }
    }
  }
}

function die(what) {
  if (state !== STATE.PLAYING) return;
  state = STATE.DYING;
  deathReason = what;
  cat.vy = Math.min(cat.vy, -110);   // small recoil, then down he goes
  shake = 1;
}

// ---------------------------------------------------------------- drawing
function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * 9 * shake, (Math.random() - 0.5) * 9 * shake);
  }

  drawRoom();
  for (const w of walls || []) drawWall(w);
  drawFloor();
  drawEddie();
  drawPamuk();

  ctx.restore();
  drawHud();
}

function drawRoom() {
  const g = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  g.addColorStop(0, '#f6ead8');
  g.addColorStop(1, '#e0cdb4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, FLOOR_Y);

  // far wall: a bookshelf and a window, drifting slowly for parallax
  const px = -(dist * 0.11) % 560;
  ctx.save();
  ctx.globalAlpha = 0.26;
  ctx.strokeStyle = C.wallEdge;
  ctx.lineJoin = 'round';
  for (let base = px; base < W + 560; base += 560) {
    // window: frame and glazing bars, not a floating rectangle
    ctx.lineWidth = 7;
    ctx.strokeStyle = C.wallEdge;
    ctx.strokeRect(base + 40, 96, 128, 168);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(base + 104, 96); ctx.lineTo(base + 104, 264);
    ctx.moveTo(base + 40, 180); ctx.lineTo(base + 168, 180);
    ctx.stroke();

    // bookshelf: outline, shelves, and feet
    ctx.lineWidth = 6;
    ctx.strokeRect(base + 250, 200, 150, 250);
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let sh = 1; sh < 4; sh++) {
      ctx.moveTo(base + 250, 200 + sh * 62);
      ctx.lineTo(base + 400, 200 + sh * 62);
    }
    ctx.moveTo(base + 262, 450); ctx.lineTo(base + 262, 468);
    ctx.moveTo(base + 388, 450); ctx.lineTo(base + 388, 468);
    ctx.stroke();
  }
  ctx.restore();

  // window light on the floor-ward half
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#fffaf0';
  ctx.fillRect(0, 0, W, 230);
  ctx.restore();
}

function drawWall(w) {
  const x = w.x;

  // sort the holes so we can fill the masonry between them
  const holes = [...w.holes].sort((a, b) => a.cy - b.cy);
  const segments = [];
  let cursor = 0;
  for (const h of holes) {
    segments.push([cursor, h.cy - h.gap / 2]);
    cursor = h.cy + h.gap / 2;
  }
  segments.push([cursor, FLOOR_Y]);

  for (const [y0, y1] of segments) {
    if (y1 <= y0) continue;
    // the wall casts onto the room behind it, which is what sells the depth
    ctx.fillStyle = 'rgba(78,54,32,.22)';
    ctx.fillRect(x + WALL_W, y0 + 6, 14, y1 - y0);

    const g = ctx.createLinearGradient(x, 0, x + WALL_W, 0);
    g.addColorStop(0, C.wallFace);
    g.addColorStop(0.7, C.wallFace);
    g.addColorStop(1, C.wallShade);
    ctx.fillStyle = g;
    ctx.fillRect(x, y0, WALL_W, y1 - y0);

    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.fillRect(x + WALL_W - 6, y0, 6, y1 - y0);
    ctx.strokeStyle = C.wallEdge;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x + 1.25, y0, WALL_W - 2.5, y1 - y0);
  }

  for (const h of holes) drawFlap(x, h);
}

function drawFlap(x, h) {
  const top = h.cy - h.gap / 2;
  const bot = h.cy + h.gap / 2;

  // the dark of the hallway on the other side, deepest at the edges so the
  // opening reads as depth rather than as a painted-on rectangle
  const hole = ctx.createLinearGradient(x, top, x, top + h.gap);
  hole.addColorStop(0, 'rgba(28,18,11,.88)');
  hole.addColorStop(0.5, 'rgba(52,36,24,.62)');
  hole.addColorStop(1, 'rgba(28,18,11,.88)');
  ctx.fillStyle = hole;
  ctx.fillRect(x, top, WALL_W, h.gap);

  // moulded frame around the opening
  ctx.strokeStyle = C.frame;
  ctx.lineWidth = 7;
  ctx.strokeRect(x - 3, top - 3, WALL_W + 6, h.gap + 6);
  ctx.strokeStyle = C.frameLit;
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 5, top - 5, WALL_W + 10, h.gap + 10);

  // the flap: hinged at the top, translucent, and entirely passable
  ctx.save();
  ctx.translate(x + WALL_W / 2, top + 2);
  ctx.rotate(h.theta);
  const L = (bot - top) * 0.93, halfW = WALL_W / 2 + 1;
  ctx.fillStyle = 'rgba(214,236,244,.26)';
  ctx.fillRect(-halfW, 0, halfW * 2, L);
  // one raking highlight, so it reads as a sheet of plastic catching the light
  ctx.fillStyle = 'rgba(255,255,255,.34)';
  ctx.beginPath();
  ctx.moveTo(-halfW + 5, 8);
  ctx.lineTo(-halfW + 15, 8);
  ctx.lineTo(-halfW + 7, L - 10);
  ctx.lineTo(-halfW + 3, L - 10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,96,70,.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(-halfW, 0, halfW * 2, L);
  // weighted bottom rail, the bit that actually clacks
  ctx.fillStyle = 'rgba(126,100,72,.85)';
  ctx.fillRect(-halfW, L - 7, halfW * 2, 7);
  ctx.fillStyle = C.frame;
  ctx.fillRect(-halfW - 2, -4, halfW * 2 + 4, 6);   // the hinge bar
  ctx.restore();
}

function drawFloor() {
  ctx.fillStyle = C.skirting;
  ctx.fillRect(0, FLOOR_Y - 14, W, 14);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(0, FLOOR_Y - 4, W, 4);

  ctx.fillStyle = C.floor;
  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

  const off = -dist % 74;
  ctx.strokeStyle = C.floorDark;
  ctx.lineWidth = 2;
  for (let i = -1; i < W / 74 + 2; i++) {
    const bx = off + i * 74;
    ctx.beginPath();
    ctx.moveTo(bx, FLOOR_Y);
    ctx.lineTo(bx - 16, H);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y + 30); ctx.lineTo(W, FLOOR_Y + 30);
  ctx.stroke();
}

function drawEddie() {
  if (!eddieImg.complete || !eddie) return;
  const w = 74, h = 74 * 144 / 194;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.drawImage(eddieImg, eddie.x, FLOOR_Y + 16 - h / 2, w, h);
  ctx.restore();
}

function drawPamuk() {
  if (!pamukImg.complete) return;
  const bob = state === STATE.TITLE ? Math.sin(elapsed * 2.6) * 11 : 0;
  const ty = state === STATE.TITLE ? 372 : cat.y;
  const rot = state === STATE.TITLE ? Math.sin(elapsed * 2.6) * 0.09 : cat.rot;

  ctx.save();
  ctx.translate(cat.x, ty + bob);
  ctx.rotate(rot);
  // the sprite faces left; Pamuk is going right, so mirror him
  ctx.scale(-1, 1);
  // a squash on the up-kick, so the flap has weight
  const k = 1 + cat.legKick * 0.10;
  ctx.drawImage(pamukImg, -CAT_W / 2 * k, -CAT_H / 2 / k, CAT_W * k, CAT_H / k);
  ctx.restore();
}

// ---------------------------------------------------------------- hud
function shadowText(text, x, y, size, weight, align) {
  ctx.font = `${weight || 700} ${size}px "Avenir Next", "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.16);
  ctx.strokeStyle = 'rgba(40,26,16,.80)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#fffaf1';
  ctx.fillText(text, x, y);
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(32,21,14,.80)';
  ctx.strokeStyle = 'rgba(255,245,230,.30)';
  ctx.lineWidth = 2;
  if (ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  }
}

function drawHud() {
  if (state === STATE.PLAYING || state === STATE.DYING) {
    shadowText(String(score), W / 2, 92, 62);
    return;
  }

  if (state === STATE.TITLE) {
    panel(30, 58, W - 60, 214);
    shadowText("PAMUK'S", W / 2, 114, 40);
    shadowText('LIBERATION DAY', W / 2, 158, 40);

    ctx.font = '15px "Avenir Next", "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,240,222,.82)';
    ctx.fillText('One year of the cat flap.', W / 2, 190);
    ctx.fillText('Go through as many as he can.', W / 2, 212);
    ctx.fillStyle = 'rgba(255,240,222,.55)';
    ctx.fillText('The flaps are not solid. The wall is.', W / 2, 242);

    const pulse = 0.66 + Math.sin(elapsed * 3.4) * 0.34;
    ctx.globalAlpha = pulse;
    shadowText('TAP TO FLY', W / 2, 508, 27);
    ctx.globalAlpha = 1;

    ctx.font = '13px "Avenir Next", "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,240,222,.45)';
    ctx.fillText('There is no sound. He would not hear it anyway.', W / 2, 588);
    if (best > 0) {
      ctx.fillStyle = 'rgba(255,240,222,.75)';
      ctx.fillText('Best: ' + best + (best === 1 ? ' flap' : ' flaps'), W / 2, 548);
    }
    return;
  }

  if (state === STATE.OVER) {
    panel(46, 176, W - 92, 236);
    shadowText(String(score), W / 2, 260, 66);
    ctx.font = '15px "Avenir Next", "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,240,222,.85)';
    ctx.fillText(score === 1 ? 'flap' : 'flaps', W / 2, 286);
    ctx.fillStyle = 'rgba(255,240,222,.60)';
    ctx.fillText('Stopped by ' + deathReason + '.', W / 2, 322);

    ctx.fillStyle = score >= best && score > 0
      ? 'rgba(255,225,150,.95)' : 'rgba(255,240,222,.75)';
    ctx.fillText(
      (score >= best && score > 0 ? 'A new best — ' : 'Best ') + best,
      W / 2, 352
    );

    const pulse = 0.6 + Math.sin(elapsed * 3.4) * 0.4;
    ctx.globalAlpha = pulse;
    shadowText('TAP TO GO AGAIN', W / 2, 392, 20);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  // clamp dt so a backgrounded tab does not teleport him into a wall
  const dt = Math.min(0.034, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset(true);
resize();
requestAnimationFrame(frame);

})();
</script>
