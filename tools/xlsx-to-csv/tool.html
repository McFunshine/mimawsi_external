<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>XLSX to CSV</title>
<style>:root{color-scheme:light dark;--bg:#fbfbf9;--fg:#1a1a18;--mut:#6b6b66;--line:#e0e0da;--acc:#3b5bdb;--ok:#2f7d4f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#e8e8e4;--mut:#9a9a94;--line:#2e2e34;--acc:#8ea3f0;--ok:#6fcf97;--bad:#f2837a}}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1.25rem 4rem;background:var(--bg);color:var(--fg);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 .25rem;letter-spacing:-.01em}
p.sub{color:var(--mut);margin:0 0 1.75rem;font-size:.95rem}
label{display:block;font-size:.8rem;color:var(--mut);margin:1rem 0 .3rem;text-transform:uppercase;letter-spacing:.04em}
textarea,input,select{width:100%;font:inherit;padding:.55rem .65rem;background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px}
textarea{min-height:9rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;resize:vertical}
input[type=range]{padding:0}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:.5rem 1rem;border:1px solid transparent;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:inherit;border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem 1rem}
.out{margin-top:1.5rem;padding:1rem;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--fg) 3%,transparent);overflow-x:auto}
.big{font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.1}
.mut{color:var(--mut);font-size:.85rem}
.err{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:2rem 1rem;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--fg)}
footer{max-width:44rem;margin:3rem auto 0;color:var(--mut);font-size:.78rem;border-top:1px solid var(--line);padding-top:.75rem}</style>
</head>
<body>
<main>
<h1>XLSX to CSV</h1>
<p class="sub">Drop a spreadsheet and take the CSV away, one file per sheet, without uploading it anywhere.</p>
<div class="drop" id="drop">Drop an <strong>.xlsx</strong> here, or click to choose one
<input type="file" id="file" accept=".xlsx,.xlsm" hidden=""></div>

<div class="cols" style="margin-top:1rem">
  <div>
    <label for="delim">Separator</label>
    <select id="delim">
      <option value=",">Comma  ,</option>
      <option value=";">Semicolon  ;  (Excel in most of Europe)</option>
      <option value="	">Tab</option>
      <option value="|">Pipe  |</option>
    </select>
  </div>
  <div>
    <label for="eol">Line endings</label>
    <select id="eol">
      <option value="crlf">CRLF — what Excel writes</option>
      <option value="lf">LF — what everything else wants</option>
    </select>
  </div>
</div>
<div class="row">
  <label style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem;color:inherit"><input type="checkbox" id="dates" checked=""> Dates as <code>YYYY-MM-DD</code>, not serial numbers</label>
  <label style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem;color:inherit"><input type="checkbox" id="bom" checked=""> Add a BOM so Excel reads accents correctly</label>
  <label style="margin:0;text-transform:none;letter-spacing:0;font-size:.9rem;color:inherit"><input type="checkbox" id="guard"> Defuse cells starting <code>= + - @</code></label>
</div>

<div class="out" id="out"><span class="mut">Nothing loaded yet. The file is read here, in the page — it is never sent anywhere.</span></div>
</main>
<footer>Works offline. Nothing you enter leaves this file.</footer>
<script>
const u16 = (d, o) => d[o] | d[o + 1] << 8
const u32 = (d, o) => (d[o] | d[o + 1] << 8 | d[o + 2] << 16 | d[o + 3] << 24) >>> 0
const dec = new TextDecoder()

// The end-of-central-directory record sits in the last 64KB, after a comment of
// unknown length, so it has to be found by scanning backwards for its signature.
function findEOCD (d) {
  const stop = Math.max(0, d.length - 65558)
  for (let i = d.length - 22; i >= stop; i--) if (u32(d, i) === 0x06054b50) return i
  return -1
}

async function inflateRaw (bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
  return new Uint8Array(await new Response(s).arrayBuffer())
}

async function unzip (buf) {
  const d = new Uint8Array(buf)
  const e = findEOCD(d)
  if (e < 0) throw new Error('This is not a ZIP archive, so it cannot be an .xlsx. An old .xls is a completely different format and this tool cannot read it.')
  const count = u16(d, e + 10), cdOff = u32(d, e + 16)
  if (count === 0xffff || cdOff === 0xffffffff) throw new Error('This file uses ZIP64, which this tool does not read. That means a spreadsheet far larger than anything a browser could convert anyway.')
  const parts = new Map()
  let p = cdOff
  for (let i = 0; i < count; i++) {
    if (u32(d, p) !== 0x02014b50) break
    const method = u16(d, p + 10)
    const csize = u32(d, p + 20)
    const nameLen = u16(d, p + 28), extraLen = u16(d, p + 30), cmtLen = u16(d, p + 32)
    const lho = u32(d, p + 42)
    const name = dec.decode(d.subarray(p + 46, p + 46 + nameLen))
    p += 46 + nameLen + extraLen + cmtLen
    // The local header repeats the name and extra fields, and its extra field
    // length often differs from the central one. The data starts after it.
    if (u32(d, lho) !== 0x04034b50) continue
    const start = lho + 30 + u16(d, lho + 26) + u16(d, lho + 28)
    parts.set(name, { method, bytes: d.subarray(start, start + csize) })
  }
  return {
    names: [...parts.keys()],
    async read (name) {
      const e = parts.get(name)
      if (!e) return null
      if (e.method === 0) return dec.decode(e.bytes)
      if (e.method !== 8) throw new Error('Part "' + name + '" uses an unsupported compression method.')
      return dec.decode(await inflateRaw(e.bytes))
    }
  }
}

const X = (node, name) => [...node.getElementsByTagNameNS('*', name)]
function xml (text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml')
  if (doc.getElementsByTagName('parsererror').length) throw new Error('A part of this workbook is not valid XML.')
  return doc
}

// Shared strings: cell text lives in one table and cells point at it by index.
// Rich text splits a single string across several <r><t> runs, and <rPh> holds
// Japanese phonetic hints that must NOT be concatenated into the value.
function sharedStrings (text) {
  if (!text) return []
  return X(xml(text), 'si').map(si => {
    let out = ''
    for (const n of si.childNodes) {
      const tag = (n.localName || '')
      if (tag === 't') out += n.textContent
      else if (tag === 'r') for (const c of n.childNodes) if ((c.localName || '') === 't') out += c.textContent
    }
    return out
  })
}

// A cell is only a date because its number format says so. Builtin ids 14-22 and
// 45-47 are dates and times; anything else has to be read out of <numFmts>.
const BUILTIN = { 14: 'd', 15: 'd', 16: 'd', 17: 'd', 18: 't', 19: 't', 20: 't', 21: 't', 22: 'dt', 45: 't', 46: 't', 47: 't' }
function formatKind (code) {
  // Strip quoted literals, escaped characters, colour and condition blocks, so a
  // format like "Day" 0.00 or [Red]0 cannot be mistaken for a date.
  const c = code.replace(/"[^"]*"/g, '').replace(/\\./g, '').replace(/\[[^\]]*\]/g, '')
  const hasDate = /[yd]/i.test(c)
  const hasTime = /[hs]/i.test(c)
  if (hasDate && hasTime) return 'dt'
  if (hasDate) return 'd'
  if (hasTime) return 't'
  return ''
}
function styleKinds (text) {
  if (!text) return []
  const doc = xml(text)
  const custom = new Map()
  for (const n of X(doc, 'numFmt')) custom.set(+n.getAttribute('numFmtId'), n.getAttribute('formatCode') || '')
  const cellXfs = X(doc, 'cellXfs')[0]
  if (!cellXfs) return []
  return X(cellXfs, 'xf').map(xf => {
    const id = +(xf.getAttribute('numFmtId') || 0)
    if (BUILTIN[id]) return BUILTIN[id]
    const code = custom.get(id)
    return code ? formatKind(code) : ''
  })
}

// Excel's serial dates carry a deliberate bug: 1900 is treated as a leap year,
// so serial 60 is 29 February 1900, a day that never happened. Everything at or
// below it is therefore one day adrift and has to be nudged back.
const PHANTOM = 60
function serialToParts (v, date1904) {
  let s = v
  let phantom = false
  if (date1904) {
    return { ms: Date.UTC(1904, 0, 1) + Math.round(s * 86400000), phantom }
  }
  if (Math.floor(s) === PHANTOM) phantom = true
  if (s < PHANTOM) s += 1
  return { ms: Date.UTC(1899, 11, 30) + Math.round(s * 86400000), phantom }
}
const p2 = n => String(n).padStart(2, '0')
function serialToText (v, kind, date1904) {
  if (!isFinite(v)) return String(v)
  const { ms, phantom } = serialToParts(v, date1904)
  const d = new Date(ms)
  if (isNaN(d.getTime())) return String(v)
  const date = d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate())
  const time = p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds())
  if (kind === 't') {
    // A pure time can exceed 24 hours (a duration), which no clock can show.
    if (v >= 1) { const h = Math.floor(v * 24); const m = Math.floor(v * 1440) % 60; const sec = Math.round(v * 86400) % 60; return h + ':' + p2(m) + ':' + p2(sec) }
    return time
  }
  const text = kind === 'dt' ? date + ' ' + time : date
  return phantom ? text + ' (29 Feb 1900 does not exist)' : text
}

// A1 -> 0. Needed because cells are sparse: a row may jump from A to D.
function colIndex (ref) {
  let n = 0
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i)
    if (c < 65 || c > 90) break
    n = n * 26 + (c - 64)
  }
  return n - 1
}

function readSheet (text, strings, kinds, date1904, opts) {
  const doc = xml(text)
  const rows = []
  let notes = 0
  for (const row of X(doc, 'row')) {
    const cells = []
    let max = -1
    for (const c of X(row, 'c')) {
      const ref = c.getAttribute('r') || ''
      const at = ref ? colIndex(ref) : cells.length
      const t = c.getAttribute('t') || 'n'
      const sIdx = c.getAttribute('s')
      let value = ''
      if (t === 'inlineStr') {
        const is = X(c, 'is')[0]
        value = is ? X(is, 't').map(n => n.textContent).join('') : ''
      } else {
        const v = X(c, 'v')[0]
        const raw = v ? v.textContent : ''
        if (raw === '') value = ''
        else if (t === 's') value = strings[+raw] ?? ''
        else if (t === 'b') value = raw === '1' ? 'TRUE' : 'FALSE'
        else if (t === 'e') { value = raw; notes++ }
        else if (t === 'str' || t === 'd') value = raw
        else {
          const kind = sIdx != null ? kinds[+sIdx] : ''
          value = (kind && opts.dates) ? serialToText(Number(raw), kind, date1904) : raw
        }
      }
      if (at >= 0) { cells[at] = value; if (at > max) max = at }
    }
    const r = +(row.getAttribute('r') || rows.length + 1)
    rows[r - 1] = cells
  }
  // Fill the gaps left by absent rows and ragged widths so the CSV is rectangular.
  const width = rows.reduce((w, r) => Math.max(w, r ? r.length : 0), 0)
  const out = []
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i] || []
    const line = []
    for (let j = 0; j < width; j++) line.push(r[j] == null ? '' : r[j])
    out.push(line)
  }
  return { rows: out, width, errors: notes }
}

function trimBlank (rows) {
  let end = rows.length
  while (end > 0 && rows[end - 1].every(c => c === '')) end--
  return rows.slice(0, end)
}

function toCSV (rows, opts) {
  const d = opts.delim, eol = opts.crlf ? '\r\n' : '\n'
  const cell = v => {
    let s = String(v)
    // A leading =, +, - or @ makes a spreadsheet treat the text as a formula
    // when the CSV is opened again. Only relevant if the user asks for it.
    if (opts.guard && /^[=+\-@]/.test(s)) s = "'" + s
    // Tested by inclusion rather than a built regex: the delimiter would have to
    // be escaped into a character class, and that is a needless trap.
    const quote = s.indexOf(d) >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0 || s.indexOf('\r') >= 0
    return quote ? '"' + s.split('"').join('""') + '"' : s
  }
  return rows.map(r => r.map(cell).join(d)).join(eol) + eol
}

// A ZIP writer, so 14 sheets are one download rather than 14 prompts. Entries are
// stored uncompressed — CSV text zips well but the browser has no deflate encoder
// that is worth the code here, and correctness matters more than bytes.
const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1; t[i] = c >>> 0 } return t })()
function crc32 (b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ c >>> 8; return (c ^ 0xFFFFFFFF) >>> 0 }
function zip (files) {
  const enc = new TextEncoder()
  const chunks = [], central = []
  let off = 0
  for (const f of files) {
    const name = enc.encode(f.name), body = enc.encode(f.text)
    const crc = crc32(body)
    const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer)
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(8, 0, true)
    dv.setUint32(14, crc, true); dv.setUint32(18, body.length, true); dv.setUint32(22, body.length, true)
    dv.setUint16(26, name.length, true)
    lh.set(name, 30)
    chunks.push(lh, body)
    const cd = new Uint8Array(46 + name.length), cv = new DataView(cd.buffer)
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true)
    cv.setUint32(16, crc, true); cv.setUint32(20, body.length, true); cv.setUint32(24, body.length, true)
    cv.setUint16(28, name.length, true); cv.setUint32(42, off, true)
    cd.set(name, 46)
    central.push(cd)
    off += lh.length + body.length
  }
  let cdLen = 0
  for (const c of central) cdLen += c.length
  const end = new Uint8Array(22), ev = new DataView(end.buffer)
  ev.setUint32(0, 0x06054b50, true)
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true)
  ev.setUint32(12, cdLen, true); ev.setUint32(16, off, true)
  return new Blob([...chunks, ...central, end], { type: 'application/zip' })
}

function safeName (s) { return (s.replace(/[\/\\?%*:|"<>]/g, '-').replace(/\s+/g, ' ').trim() || 'sheet').slice(0, 80) }

// Sheet order and names come from workbook.xml, but the file each tab points at
// comes from the relationship id. sheet1.xml is not reliably the first tab.
async function openWorkbook (buf) {
  const z = await unzip(buf)
  const wbText = await z.read('xl/workbook.xml')
  if (!wbText) throw new Error('No xl/workbook.xml inside. This is a ZIP, but not a spreadsheet — if it came from Numbers or Google Sheets, export it as .xlsx first.')
  const wb = xml(wbText)
  const date1904 = X(wb, 'workbookPr').some(p => /^(1|true)$/i.test(p.getAttribute('date1904') || p.getAttribute('dateCompatibility') || ''))
  const rels = new Map()
  const relText = await z.read('xl/_rels/workbook.xml.rels')
  if (relText) for (const r of X(xml(relText), 'Relationship')) rels.set(r.getAttribute('Id'), r.getAttribute('Target'))
  const strings = sharedStrings(await z.read('xl/sharedStrings.xml'))
  const kinds = styleKinds(await z.read('xl/styles.xml'))
  const sheets = []
  for (const s of X(wb, 'sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')
    let target = rels.get(rid) || ''
    if (target.startsWith('/')) target = target.slice(1)
    else if (target && !target.startsWith('xl/')) target = 'xl/' + target
    sheets.push({
      name: s.getAttribute('name') || 'Sheet',
      hidden: (s.getAttribute('state') || '') !== '',
      path: target
    })
  }
  return { z, sheets, strings, kinds, date1904 }
}

</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let BOOK = null

const opts = () => ({
  delim: $('#delim').value,
  crlf: $('#eol').value === 'crlf',
  dates: $('#dates').checked,
  guard: $('#guard').checked
})

function esc (s) { return String(s).replace(/[<&>]/g, c => c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;') }

async function load (file) {
  $('#out').innerHTML = '<span class="mut">Reading ' + esc(file.name) + '…</span>'
  try {
    const buf = await file.arrayBuffer()
    const wb = await openWorkbook(buf)
    const sheets = []
    for (const s of wb.sheets) {
      if (!s.path) { sheets.push({ ...s, error: 'no data part' }); continue }
      const text = await wb.z.read(s.path)
      if (text == null) { sheets.push({ ...s, error: 'missing ' + s.path }); continue }
      const r = readSheet(text, wb.strings, wb.kinds, wb.date1904, opts())
      const rows = trimBlank(r.rows)
      sheets.push({ ...s, rows, width: r.width, errors: r.errors })
    }
    BOOK = { name: file.name.replace(/\.[^.]+$/, ''), sheets, date1904: wb.date1904 }
    render()
  } catch (e) {
    $('#out').innerHTML = '<span class="err">' + esc(e.message || String(e)) + '</span>'
    BOOK = null
  }
}

function render () {
  if (!BOOK) return
  const o = opts()
  const rows = BOOK.sheets.map((s, i) => {
    if (s.error) return '<tr><td>' + esc(s.name) + '</td><td colspan="3" class="err">' + esc(s.error) + '</td></tr>'
    const cells = s.rows.length * s.width
    return '<tr><td>' + esc(s.name) + (s.hidden ? ' <span class="mut">(hidden)</span>' : '') + '</td>' +
      '<td class="n">' + s.rows.length + '</td><td class="n">' + s.width + '</td>' +
      '<td>' + (cells ? '<button class="sec" data-i="' + i + '">CSV</button>' : '<span class="mut">empty</span>') +
      (s.errors ? ' <span class="err">' + s.errors + ' error cell' + (s.errors === 1 ? '' : 's') + '</span>' : '') + '</td></tr>'
  }).join('')
  const withData = BOOK.sheets.filter(s => !s.error && s.rows.length)
  $('#out').innerHTML =
    '<table><thead><tr><th>Sheet</th><th class="n">Rows</th><th class="n">Columns</th><th>Download</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    (BOOK.date1904 ? '<p class="mut">This workbook uses the 1904 date system, which Excel for Mac once wrote. Dates are converted accordingly.</p>' : '') +
    (withData.length > 1 ? '<div class="row"><button id="all">Download all ' + withData.length + ' sheets as a .zip</button></div>' : '') +
    (withData.length ? '<p class="mut" style="margin-top:1rem">Preview of <strong>' + esc(withData[0].name) + '</strong>, first 8 rows:</p><pre>' + esc(preview(withData[0], o)) + '</pre>' : '')
  $$('#out button[data-i]').forEach(b => b.addEventListener('click', () => save(BOOK.sheets[+b.dataset.i])))
  const all = $('#all')
  if (all) all.addEventListener('click', saveAll)
}

function preview (s, o) {
  const head = s.rows.slice(0, 8)
  const text = toCSV(head, o)
  return text.length > 1200 ? text.slice(0, 1200) + '\n…' : text
}

function blobFor (text) {
  return new Blob([$('#bom').checked ? '﻿' + text : text], { type: 'text/csv;charset=utf-8' })
}
function download (blob, name) {
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url; a.download = name
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 4000)
}
function save (s) {
  download(blobFor(toCSV(s.rows, opts())), safeName(BOOK.name) + ' - ' + safeName(s.name) + '.csv')
}
function saveAll () {
  const o = opts(), bom = $('#bom').checked
  const files = BOOK.sheets.filter(s => !s.error && s.rows.length).map(s => ({
    name: safeName(s.name) + '.csv',
    text: (bom ? '﻿' : '') + toCSV(s.rows, o)
  }))
  download(zip(files), safeName(BOOK.name) + ' - csv.zip')
}

const drop = $('#drop'), input = $('#file')
drop.addEventListener('click', () => input.click())
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over') })
drop.addEventListener('dragleave', () => drop.classList.remove('over'))
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over')
  const f = e.dataTransfer.files[0]; if (f) load(f)
})
input.addEventListener('change', () => { const f = input.files[0]; if (f) load(f) })
$$('#delim,#eol,#dates,#bom,#guard').forEach(el => el.addEventListener('change', () => {
  // Changing how dates are read means the sheets have to be parsed again.
  if (BOOK && el.id === 'dates') { const f = input.files[0]; if (f) return load(f) }
  render()
}))

if (typeof DecompressionStream === 'undefined') {
