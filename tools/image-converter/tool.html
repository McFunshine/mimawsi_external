<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Image Converter</title>
<style>:root{color-scheme:light dark;--bg:#fbfbf9;--fg:#1a1a18;--mut:#6b6b66;--line:#e0e0da;--acc:#3b5bdb;--ok:#2f7d4f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#e8e8e4;--mut:#9a9a94;--line:#2e2e34;--acc:#8ea3f0;--ok:#6fcf97;--bad:#f2837a}}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1.25rem 4rem;background:var(--bg);color:var(--fg);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 .25rem;letter-spacing:-.01em}
p.sub{color:var(--mut);margin:0 0 1.75rem;font-size:.95rem}
label{display:block;font-size:.8rem;color:var(--mut);margin:1rem 0 .3rem;text-transform:uppercase;letter-spacing:.04em}
textarea,input,select{width:100%;font:inherit;padding:.55rem .65rem;background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px}
textarea{min-height:9rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;resize:vertical}
input[type=range]{padding:0}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:.5rem 1rem;border:1px solid transparent;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:inherit;border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem 1rem}
.out{margin-top:1.5rem;padding:1rem;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--fg) 3%,transparent);overflow-x:auto}
.big{font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.1}
.mut{color:var(--mut);font-size:.85rem}
.err{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:2rem 1rem;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--fg)}
footer{max-width:44rem;margin:3rem auto 0;color:var(--mut);font-size:.78rem;border-top:1px solid var(--line);padding-top:.75rem}</style>
</head>
<body>
<main>
<h1>Image Converter</h1>
<p class="sub">PNG, JPEG, JPG and WebP, converted in the page. Drop several at once.</p>
<div class="drop" id="drop" data-multiple="true">Drop images here, click to choose, or paste</div>
<div class="row">
  <label style="margin:0;text-transform:none">Convert to <select id="fmt" style="width:auto"><option value="webp">WebP</option><option value="jpeg">JPEG</option><option value="jpg">JPG</option><option value="png">PNG</option></select></label>
</div>
<div class="out"><table id="out"><tbody><tr><td class="mut">Nothing yet.</td></tr></tbody></table></div>
<div class="row"><button id="all" disabled="">Download</button></div>
</main>
<footer>Works offline. Nothing you enter leaves this file.</footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function dropZone (el, onFile, accept) {
  const input = document.createElement('input')
  input.type = 'file'; input.accept = accept || 'image/*'; input.style.display = 'none'
  input.multiple = el.dataset.multiple === 'true'
  document.body.appendChild(input)
  el.addEventListener('click', () => input.click())
  input.addEventListener('change', () => { if (input.files.length) onFile([...input.files]); input.value = '' })
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over') })
  el.addEventListener('dragleave', () => el.classList.remove('over'))
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over')
    const files = [...e.dataTransfer.files].filter(f => !accept || accept === '*' || f.type.startsWith(accept.replace('/*', '')))
    if (files.length) onFile(files)
  })
  window.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])]
    if (files.length) onFile(files)
  })
}
function loadImage (file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file)
    const img = new Image()
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 5000) }
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Not an image this browser can read')) }
    img.src = url
  })
}
function save (blob, name) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = name; a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 2000)
}
const kb = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'

// Fixed deliberately, so there is nothing to get wrong: the JPEG quality the
// tool has always used, and white behind anything transparent.
const QUALITY = 0.85, BG = '#ffffff'
// JPEG twice on purpose. Same bytes, same MIME type, different extension —
// some systems reject .jpeg and some reject .jpg, and you rarely get to argue.
const FORMATS = {
  webp: { mime: 'image/webp', ext: 'webp' },
  jpeg: { mime: 'image/jpeg', ext: 'jpeg' },
  jpg: { mime: 'image/jpeg', ext: 'jpg' },
  png: { mime: 'image/png', ext: 'png' }
}
const fmt = () => FORMATS[$('#fmt').value]
const esc = s => String(s).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')
// Leading dots and dashes are stripped as well as illegal characters: a name
// like ../../etc/passwd must not survive as a path inside the .zip.
function safeName (s) {
  const out = String(s).replace(/[^A-Za-z0-9 ._-]+/g, '-').replace(/\.+/g, '.')
    .replace(/^[.\-\s]+/, '').replace(/[.\-\s]+$/, '').slice(0, 80)
  return out || 'image'
}

// A blob: URL taints the canvas at file://, which would make toBlob throw on
// every conversion. A data: URL does not.
function loadImageData (file) {
  return new Promise((res, rej) => {
    const fr = new FileReader()
    fr.onerror = () => rej(new Error('Could not read this file'))
    fr.onload = () => {
      const img = new Image()
      img.onload = () => img.width && img.height ? res(img) : rej(new Error('No fixed pixel size to convert'))
      img.onerror = () => rej(new Error('Not an image this browser can read'))
      img.src = fr.result
    }
    fr.readAsDataURL(file)
  })
}

const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1; t[i] = c >>> 0 } return t })()
function crc32 (b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ c >>> 8; return (c ^ 0xFFFFFFFF) >>> 0 }
// Stored, not deflated: these are already-compressed images, so deflating them
// costs time and saves nothing.
function zip (files) {
  const enc = new TextEncoder()
  const chunks = [], central = []
  let off = 0
  for (const f of files) {
    const name = enc.encode(f.name), body = f.bytes
    const crc = crc32(body)
    const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer)
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(8, 0, true)
    dv.setUint32(14, crc, true); dv.setUint32(18, body.length, true); dv.setUint32(22, body.length, true)
    dv.setUint16(26, name.length, true)
    lh.set(name, 30)
    chunks.push(lh, body)
    const cd = new Uint8Array(46 + name.length), cv = new DataView(cd.buffer)
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true)
    cv.setUint32(16, crc, true); cv.setUint32(20, body.length, true); cv.setUint32(24, body.length, true)
    cv.setUint16(28, name.length, true); cv.setUint32(42, off, true)
    cd.set(name, 46)
    central.push(cd)
    off += lh.length + body.length
  }
  let cdLen = 0
  for (const c of central) cdLen += c.length
  const end = new Uint8Array(22), ev = new DataView(end.buffer)
  ev.setUint32(0, 0x06054b50, true)
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true)
  ev.setUint32(12, cdLen, true); ev.setUint32(16, off, true)
  return new Blob([...chunks, ...central, end], { type: 'application/zip' })
}

let results = [], queue = []
async function convert (file) {
  const img = await loadImageData(file)
  const f = fmt()
  const cv = document.createElement('canvas')
  cv.width = img.width; cv.height = img.height
  const c = cv.getContext('2d')
  if (f.mime === 'image/jpeg') { c.fillStyle = BG; c.fillRect(0, 0, cv.width, cv.height) }
  c.drawImage(img, 0, 0)
  const blob = await new Promise(r => cv.toBlob(r, f.mime, QUALITY))
  if (!blob) throw new Error('The browser refused to encode this image')
  return { name: file.name.replace(/\.[^.]+$/, ''), from: file.size, to: blob.size, blob, w: img.width, h: img.height, wanted: f.mime, actual: blob.type }
}

// Two files can convert to the same name — a.png and a.gif both become a.webp.
function outputFiles () {
  const f = fmt(), taken = new Set()
  return results.filter(r => r.blob).map(r => {
    const base = safeName(r.name)
    let name = base + '.' + f.ext, n = 2
    while (taken.has(name)) name = base + ' (' + (n++) + ').' + f.ext
    taken.add(name)
    return { name, blob: r.blob }
  })
}

dropZone($('#drop'), async files => { queue = files; await rerun() })
async function rerun () {
  if (!queue.length) return
  $('#out').tBodies[0].innerHTML = '<tr><td class="mut">Converting ' + queue.length + '…</td></tr>'
  results = []
  for (const f of queue) { try { results.push(await convert(f)) } catch (e) { results.push({ name: f.name, err: e.message }) } }
  const ext = fmt().ext
  const many = results.length > 1
  const unsupported = results.find(r => r.actual && r.actual !== r.wanted)
  $('#out').tBodies[0].innerHTML = '<tr><th>File</th><th class="n">Size</th><th class="n">Before</th><th class="n">Change</th>' + (many ? '<th></th>' : '') + '</tr>' +
    results.map((r, i) => r.err
      ? '<tr><td>' + esc(r.name) + '</td><td colspan="' + (many ? 4 : 3) + '" class="err">' + esc(r.err) + '</td></tr>'
      : '<tr><td>' + esc(safeName(r.name)) + '.' + ext + ' <span class="mut">' + r.w + '×' + r.h + '</span></td><td class="n">' + kb(r.to) + '</td><td class="n mut">' + kb(r.from) + '</td><td class="n" style="color:var(--' + (r.to < r.from ? 'ok' : 'bad') + ')">' + (r.to < r.from ? '−' : '+') + Math.abs(100 - Math.round(r.to / r.from * 100)) + '%</td>' + (many ? '<td><button class="sec" data-i="' + i + '">Save</button></td>' : '') + '</tr>').join('') +
    (unsupported ? '<tr><td colspan="5" class="err">This browser cannot write ' + esc(unsupported.wanted) + ' — it produced ' + esc(unsupported.actual) + ' instead.</td></tr>' : '')
  const out = outputFiles()
  $('#all').disabled = !out.length
  $('#all').textContent = out.length > 1 ? 'Download all' : 'Download'
}

$('#out').addEventListener('click', e => {
  const i = e.target.dataset.i; if (i === undefined) return
  const f = outputFiles()[results.slice(0, Number(i)).filter(r => r.blob).length]
  if (f) save(f.blob, f.name)
})
$('#all').addEventListener('click', async () => {
  const files = outputFiles()
  if (!files.length) return
  if (files.length === 1) { save(files[0].blob, files[0].name); return }
  const parts = []
  for (const f of files) parts.push({ name: f.name, bytes: new Uint8Array(await f.blob.arrayBuffer()) })
  save(zip(parts), 'converted-' + fmt().ext + '.zip')
})
$('#fmt').addEventListener('change', rerun)
</script>


</body></html>
