<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>What C?</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}@media (hover:none){input,textarea,select{font-size:16px}}

.board{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tile{
  background:#262431;border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  font-family:var(--mono);font-size:.86rem;cursor:pointer;color:var(--ink);text-align:left;
}
.tile:hover{border-color:var(--cool)}
.tile.picked{border-color:var(--gold);color:var(--gold)}
.tile.right{border-color:var(--ok);color:var(--ok)}
.tile.wrong{border-color:var(--bad);color:var(--bad)}
.tile.gone{opacity:.28;pointer-events:none}
.bigq{font-size:1.1rem;margin:2px 0 14px;line-height:1.4}
.meter{height:6px;background:#262431;border-radius:3px;overflow:hidden;margin:10px 0}
.meter > div{height:100%;background:var(--cool);width:0;transition:width .3s}
.scoreline{font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

.hexwrap{overflow-x:auto;padding:4px 0}
.hexq{font-size:1.05rem;margin:10px 0;line-height:1.4;min-height:2.6em}
.hexhint{font-family:var(--mono);color:var(--gold);letter-spacing:.1em}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> What C?</h1>
<div class="sub">Connect the left edge to the right</div></header>

<div class="panel">
  <div class="hexwrap"><svg id="board" width="560" height="330" viewBox="0 0 560 330" aria-label="Hexagon board"></svg></div>
  <p class="note" id="goal"></p>
</div>
<div class="panel hidden" id="askp">
  <p class="hexhint" id="letter"></p>
  <p class="hexq" id="q"></p>
  <div class="row">
    <input id="guess" placeholder="your answer" autocomplete="off" spellcheck="false" style="max-width:340px">
    <button id="go">Answer</button>
    <button id="pass" class="ghost">Pass</button>
  </div>
  <p class="note" id="status"></p>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>
<script>
const DATA = {"title":"What C?","cells":{"0,0":{"letter":"L","q":"Which compilation is called Blank Traces?","a":"Lipstick","also":["Lipstick Traces"]},"0,1":{"letter":"D","q":"Which 1993 single asks from despair to where?","a":"From Despair to Where","also":["Despair"]},"0,2":{"letter":"M","q":"Which 1991 single was their Heavenly debut?","a":"Motown Junk","also":[]},"0,3":{"letter":"H","q":"Which Cuban capital did they play in 2001?","a":"Havana","also":[]},"1,0":{"letter":"V","q":"Which art movement gave a B-side its name?","a":"Vorticists","also":["Vorticism"]},"1,1":{"letter":"B","q":"Which Caerphilly town were they formed in?","a":"Blackwood","also":[]},"1,2":{"letter":"I","q":"Which 1998 number one begins \"If you tolerate this\"?","a":"If You Tolerate This","also":[]},"1,3":{"letter":"O","q":"Which 2001 single did Bradfield write about his mother?","a":"Ocean Spray","also":[]},"2,0":{"letter":"R","q":"Which 1994 single is a word reversed?","a":"Revol","also":[]},"2,1":{"letter":"W","q":"Which member moved from guitar to bass?","a":"Wire","also":["Nicky Wire"]},"2,2":{"letter":"E","q":"Which 1996 album title is an instruction?","a":"Everything Must Go","also":[]},"2,3":{"letter":"N","q":"Which Swedish singer guested in 2007?","a":"Nina Persson","also":["Persson"]},"3,0":{"letter":"P","q":"Which seaside town is near the Truth sleeve beach?","a":"Porthmadog","also":[]},"3,1":{"letter":"S","q":"Which painter made two of their sleeves?","a":"Saville","also":["Jenny Saville"]},"3,2":{"letter":"K","q":"Which photographer is named in a 1996 single?","a":"Kevin Carter","also":["Carter"]},"3,3":{"letter":"F","q":"Which Holy Bible single opens \"I am an architect\"?","a":"Faster","also":[]},"4,0":{"letter":"G","q":"Which 1992 debut promised sixteen million sales?","a":"Generation Terrorists","also":[]},"4,1":{"letter":"C","q":"Which 2025 album is their most recent?","a":"Critical Thinking","also":[]},"4,2":{"letter":"T","q":"Which brass instrument does Sean Moore play?","a":"Trumpet","also":[]},"4,3":{"letter":"A","q":"Which 1996 single shares its name with a continent?","a":"Australia","also":[]}},"cols":5,"rows":4};
function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(key){ return {
  get(f){ try { const v = localStorage.getItem(key); return v===null?f:JSON.parse(v); } catch(e){ return f; } },
  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }

const AudioKit = (() => {
  let ctx = null;
  const NOTES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** "A4" | "F#3" -> Hz. Returns 0 for a rest. */
  function freq(note){
    if (!note || note === 'r' || note === 'R') return 0;
    const m = String(note).match(/^([A-Ga-g])([#b]?)(-?\d)$/);
    if (!m) return 0;
    const semi = NOTES[m[1].toUpperCase() + m[2]];
    if (semi === undefined) return 0;
    return 440 * Math.pow(2, (semi - 9) / 12 + (Number(m[3]) - 4));
  }

  /** One note. type: square | triangle | sawtooth | sine */
  function beep(note, dur, opts){
    const c = ac(); if (!c) return;
    const o = opts || {};
    const f = typeof note === 'number' ? note : freq(note);
    if (!f) return;
    const t = c.currentTime;
    const d = dur || 0.18;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


const COLS = DATA.cols, ROWS = DATA.rows;
const W = 62, H = 54;
let won = new Set(), lost = new Set(), current = null, over = false;

function key(c, r){ return c + ',' + r; }
function cell(c, r){ return DATA.cells[key(c, r)]; }

function centre(c, r){
  return { x: 42 + c * (W * 0.78), y: 40 + r * H + (c % 2 ? H / 2 : 0) };
}

function hexPath(cx, cy){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i);
    pts.push((cx + W / 2 * Math.cos(a)).toFixed(1) + ',' + (cy + H / 2 * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function draw(){
  let out = '';
  for (let c = 0; c < COLS; c++){
    for (let r = 0; r < ROWS; r++){
      const k = key(c, r);
      const cl = cell(c, r);
      if (!cl) continue;
      const p = centre(c, r);
      const fill = won.has(k) ? '#3f7d52' : lost.has(k) ? '#5c2733' : '#2b2839';
      out += '<polygon points="' + hexPath(p.x, p.y) + '" fill="' + fill
        + '" stroke="#14131a" stroke-width="2" style="cursor:'
        + (won.has(k) || lost.has(k) || over ? 'default' : 'pointer')
        + '" data-k="' + k + '"/>';
      out += '<text x="' + p.x + '" y="' + p.y + '" fill="#fff" font-size="19" font-weight="700" '
        + 'font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="middle" '
        + 'pointer-events="none">' + cl.letter + '</text>';
    }
  }
  $('#board').innerHTML = out;
  $('#board').setAttribute('width', 42 + COLS * (W * 0.78) + 30);
  $('#board').setAttribute('height', 40 + ROWS * H + 30);
  $('#goal').textContent = over ? '' : 'Win a hexagon by answering. Connect the left edge to the right.';
}

/** Flood fill across won hexes; a path may wander, so columns are not enough. */
function connected(){
  const seen = new Set();
  const stack = [];
  for (let r = 0; r < ROWS; r++) if (won.has(key(0, r))) stack.push([0, r]);
  while (stack.length){
    const [c, r] = stack.pop();
    const k = key(c, r);
    if (seen.has(k)) continue;
    seen.add(k);
    if (c === COLS - 1) return true;
    const odd = c % 2;
    [[c, r - 1], [c, r + 1], [c - 1, r], [c + 1, r],
     [c - 1, r + (odd ? 1 : -1)], [c + 1, r + (odd ? 1 : -1)]].forEach(([nc, nr]) => {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) return;
      if (won.has(key(nc, nr)) && !seen.has(key(nc, nr))) stack.push([nc, nr]);
    });
  }
  return false;
}

$('#board').addEventListener('click', e => {
  if (over) return;
  const k = e.target.getAttribute && e.target.getAttribute('data-k');
  if (!k || won.has(k) || lost.has(k)) return;
  current = k;
  const cl = DATA.cells[k];
  $('#askp').classList.remove('hidden');
  $('#letter').textContent = 'What ' + cl.letter + '?';
  $('#q').textContent = cl.q;
  $('#status').textContent = '';
  $('#guess').value = '';
  $('#guess').focus();
});

function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

function settle(good){
  if (good) won.add(current); else lost.add(current);
  $('#askp').classList.add('hidden');
  draw();
  if (good && connected()){
    over = true;
    $('#goal').textContent = 'Connected, left to right. That is the board.';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.win();
  }
}

$('#go').addEventListener('click', () => {
  const cl = DATA.cells[current];
  const ok = [cl.a].concat(cl.also || []).some(v => norm(v) === norm($('#guess').value));
  if (ok){ if (typeof AudioKit !== 'undefined') AudioKit.sfx.good(); settle(true); }
  else {
    $('#status').textContent = 'No — it was ' + cl.a + '.';
    $('#status').className = 'note bad';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.bad();
    setTimeout(() => settle(false), 1200);
  }
});
$('#guess').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#pass').addEventListener('click', () => settle(false));

draw();

</script>


</body></html>
