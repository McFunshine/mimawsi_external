<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>The Wall</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}@media (hover:none){input,textarea,select{font-size:16px}}

.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:620px}
.brick{
  min-height:68px;background:#262431;border:1px solid var(--line);border-radius:8px;
  padding:8px 4px;font-size:.82rem;line-height:1.22;cursor:pointer;color:var(--ink);
  display:grid;place-items:center;text-align:center;transition:transform .12s,border-color .12s;
  overflow-wrap:anywhere;hyphens:auto;min-width:0;
}
.brick:hover{border-color:var(--cool)}
.brick.pick{border-color:var(--gold);color:var(--gold);transform:scale(.96)}
.brick.wrong{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.brick.locked{cursor:default;border-width:2px}
.g0{background:#3a1d24;border-color:var(--hot)!important}
.g1{background:#123a34;border-color:var(--cool)!important}
.g2{background:#3a2f12;border-color:var(--gold)!important}
.g3{background:#241f3a;border-color:#8b7ad6!important}
.grouplabel{grid-column:1/-1;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);padding:2px 0 0}
.lives{font-family:var(--mono);color:var(--bad);font-size:1.2rem;letter-spacing:.2em;min-height:1.4em}
@media (max-width:560px){.brick{font-size:.66rem;min-height:66px;padding:6px 3px}}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> The Wall</h1>
<div class="sub">Four groups of four</div></header>

<div class="panel">
  <p class="note" id="hint">Find four groups of four. Pick four and they lock if you are right.</p>
  <div class="wall" id="wall"></div>
  <div class="row" style="margin-top:12px">
    <span class="lives" id="lives"></span>
    <button id="give" class="ghost">Give up</button>
    <span class="note" id="status"></span>
  </div>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>
<script>
const DATA = {"title":"The Wall","groups":[{"label":"Songs from The Holy Bible","items":["Faster","Revol","Archives of Pain","Die in the Summertime"]},{"label":"Guest vocalists","items":["Nina Persson","Mark Lanegan","Green Gartside","Georgia Ruth"]},{"label":"Places they played","items":["Karl Marx Theatre","Millennium Stadium","London Astoria","The Roundhouse"]},{"label":"People behind the records","items":["Steve Albini","Dave Eringa","Jenny Saville","Kieran Evans"]}]};
function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(key){ return {
  get(f){ try { const v = localStorage.getItem(key); return v===null?f:JSON.parse(v); } catch(e){ return f; } },
  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }

const AudioKit = (() => {
  let ctx = null;
  const NOTES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** "A4" | "F#3" -> Hz. Returns 0 for a rest. */
  function freq(note){
    if (!note || note === 'r' || note === 'R') return 0;
    const m = String(note).match(/^([A-Ga-g])([#b]?)(-?\d)$/);
    if (!m) return 0;
    const semi = NOTES[m[1].toUpperCase() + m[2]];
    if (semi === undefined) return 0;
    return 440 * Math.pow(2, (semi - 9) / 12 + (Number(m[3]) - 4));
  }

  /** One note. type: square | triangle | sawtooth | sine */
  function beep(note, dur, opts){
    const c = ac(); if (!c) return;
    const o = opts || {};
    const f = typeof note === 'number' ? note : freq(note);
    if (!f) return;
    const t = c.currentTime;
    const d = dur || 0.18;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


let bricks = [], picked = [], solved = [], lives = 3, over = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function setup(){
  bricks = [];
  DATA.groups.forEach((g, gi) => g.items.forEach(t => bricks.push({ text: t, g: gi })));
  shuffle(bricks);
  picked = []; solved = []; lives = 3; over = false;
  draw();
}

function draw(){
  const wall = $('#wall');
  wall.replaceChildren();
  solved.forEach(gi => {
    const lab = document.createElement('div');
    lab.className = 'grouplabel';
    lab.textContent = DATA.groups[gi].label;
    wall.appendChild(lab);
    DATA.groups[gi].items.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'brick locked g' + (solved.indexOf(gi) % 4);
      b.textContent = t;
      wall.appendChild(b);
    });
  });
  bricks.filter(b => !solved.includes(b.g)).forEach(b => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'brick' + (picked.includes(b) ? ' pick' : '');
    el.textContent = b.text;
    el.addEventListener('click', () => pick(b, el));
    wall.appendChild(el);
  });
  $('#lives').textContent = solved.length >= 2 && !over
    ? '♥'.repeat(Math.max(0, lives))
    : '';
  $('#hint').textContent = solved.length >= 2
    ? 'Two left, and now the guesses are counted.'
    : 'Find four groups of four. Guesses are free until two groups are out.';
}

function pick(b, el){
  if (over) return;
  const i = picked.indexOf(b);
  if (i >= 0) picked.splice(i, 1);
  else if (picked.length < 4) picked.push(b);
  if (typeof AudioKit !== 'undefined') AudioKit.sfx.click();
  if (picked.length === 4) judge();
  else draw();
}

function judge(){
  const g = picked[0].g;
  const right = picked.every(b => b.g === g);
  if (right){
    solved.push(g);
    picked = [];
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.good();
    // Three of four found means the fourth is forced; hand it over.
    if (solved.length === 3){
      const last = [0, 1, 2, 3].find(x => !solved.includes(x));
      solved.push(last);
    }
    if (solved.length === 4) finish(true);
    draw();
    return;
  }
  // Only count a wrong guess once the free round is over.
  if (solved.length >= 2){
    lives--;
    if (lives <= 0){ finish(false); return; }
  }
  if (typeof AudioKit !== 'undefined') AudioKit.sfx.bad();
  const els = $$('.brick.pick');
  els.forEach(e => e.classList.add('wrong'));
  setTimeout(() => { picked = []; draw(); }, 340);
  $('#status').textContent = solved.length >= 2
    ? 'No. ' + lives + ' left.' : 'No.';
  $('#status').className = 'note bad';
}

function finish(won){
  over = true;
  solved = [0, 1, 2, 3];
  picked = [];
  draw();
  $('#status').textContent = won ? 'The whole wall.' : 'Out of guesses. Here it is.';
  $('#status').className = 'note ' + (won ? 'ok' : 'bad');
  if (typeof AudioKit !== 'undefined') AudioKit.sfx[won ? 'win' : 'bad']();
}

$('#give').addEventListener('click', () => { if (!over) finish(false); });
setup();

</script>


</body></html>
