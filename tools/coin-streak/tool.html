<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:"><meta charset="utf-8"><title>Coin Streak</title><style>body{font:16px/1.5 system-ui;margin:2rem auto;max-width:20rem;text-align:center}button{font:inherit;padding:.5rem 1.2rem}</style></head><body><h1>Coin Streak</h1><p>Longest run of heads in 100 flips.</p><button id="g">Go</button><p id="o">—</p><script>document.getElementById("g").onclick=function(){var best=0,run=0;for(var i=0;i<100;i++){if(Math.random()<0.5){run++;if(run>best)best=run}else{run=0}}document.getElementById("o").textContent="Longest streak: "+best};</script></body></html>
