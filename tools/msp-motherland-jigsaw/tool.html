<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MSP Motherland Jigsaw</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}@media (hover:none){input,textarea,select{font-size:16px}}

.jig{position:relative;background:#0f0e14;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.marks{position:absolute;pointer-events:none;z-index:1;
  fill:none;stroke:rgba(236,233,245,.24);stroke-width:1;shape-rendering:crispEdges}
.piece{position:absolute;background-repeat:no-repeat;cursor:grab;border-radius:2px;
  box-shadow:0 2px 6px rgba(0,0,0,.5);touch-action:none;z-index:3}
.piece.snapped{z-index:2;box-shadow:none}
.piece.drag{cursor:grabbing;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.7)}
.ghostimg{position:absolute;opacity:.14;background-repeat:no-repeat;pointer-events:none;z-index:0}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> MSP Motherland Jigsaw</h1>
<div class="sub">Drag the dragon</div></header>

<div class="panel">
  <div class="jig" id="board"></div>
  <div class="row" style="margin-top:12px">
    <button id="scatter">Scatter again</button>
    <button id="ghost" class="ghost">Show a faint guide</button>
    <span class="note" id="status"></span>
  </div>
  <p class="note" id="credit"></p>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>

    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


/*
 * The board is scaled to the screen before anything is laid out. At full size a
 * 420px picture plus padding is about 466px, which overflows a 390px phone — and
 * because the pieces carry touch-action:none, the overflow could not be scrolled
 * to, so some pieces were permanently out of reach. Measured on an emulated
 * iPhone, where a piece sat off the right edge.
 */
const N = DATA.n;
const FIT = Math.min(1, (Math.min(window.innerWidth, 760) - 58) / (DATA.w * 1.12));
const W = Math.round(DATA.w * FIT), H = Math.round(DATA.h * FIT);
const pw = Math.floor(W / N), ph = Math.floor(H / N);
const GW = pw * N, GH = ph * N;   // the grid: a pixel or two under W by H, after rounding
const board = $('#board');
const PAD = Math.round(Math.min(pw, ph) * 0.55);
board.style.width = (GW + PAD * 2) + 'px';
board.style.height = (GH + PAD * 2) + 'px';
board.style.maxWidth = '100%';
$('#credit').textContent = DATA.credit || '';

/*
 * How near a cell a piece has to be dropped before it clicks in: a tenth of a
 * cell, so the piece has to be all but aligned already. The floor of 4px keeps
 * it reachable on a phone, where a cell can be under 60px.
 */
const TOL = Math.max(4, Math.round(Math.min(pw, ph) * 0.1));

const cellX = c => PAD + c * pw;
const cellY = r => PAD + r * ph;

let pieces = [];
const filled = new Set();   // the occupied cells. One piece per cell, no stacking.
let won = false;

/** Corner brackets on the picture itself — where the four corner pieces belong. */
function drawMarks(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'marks');
  svg.setAttribute('width', GW);
  svg.setAttribute('height', GH);
  svg.setAttribute('viewBox', '0 0 ' + GW + ' ' + GH);
  svg.setAttribute('aria-hidden', 'true');
  svg.style.left = PAD + 'px';
  svg.style.top = PAD + 'px';
  const len = Math.max(6, Math.round(Math.min(pw, ph) * 0.3));
  // Half a pixel off the integer, or a 1px stroke straddles two rows and greys out.
  const x0 = 0.5, y0 = 0.5, x1 = GW - 0.5, y1 = GH - 0.5;
  const d = [
    'M' + x0 + ' ' + (y0 + len) + 'V' + y0 + 'H' + (x0 + len),
    'M' + (x1 - len) + ' ' + y0 + 'H' + x1 + 'V' + (y0 + len),
    'M' + x1 + ' ' + (y1 - len) + 'V' + y1 + 'H' + (x1 - len),
    'M' + (x0 + len) + ' ' + y1 + 'H' + x0 + 'V' + (y1 - len)
  ].join('');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', d);
  svg.appendChild(path);
  board.appendChild(svg);
}

function make(){
  board.replaceChildren();
  drawMarks();
  pieces = [];
  for (let r = 0; r < N; r++){
    for (let c = 0; c < N; c++){
      const el = document.createElement('div');
      el.className = 'piece';
      el.style.width = pw + 'px'; el.style.height = ph + 'px';
      el.style.backgroundImage = 'url(' + DATA.img + ')';
      el.style.backgroundSize = W + 'px ' + H + 'px';
      el.style.backgroundPosition = '-' + (c * pw) + 'px -' + (r * ph) + 'px';
      el.dataset.home = r * N + c;
      board.appendChild(el);
      pieces.push(el);
    }
  }
  scatter();
}

/** Lift a piece out of whatever cell it held, freeing that cell for another piece. */
function detach(el){
  if (el.dataset.cell !== undefined){
    filled.delete(Number(el.dataset.cell));
    delete el.dataset.cell;
  }
  el.classList.remove('snapped', 'set');
}

function scatter(){
  won = false;
  pieces.forEach(el => {
    detach(el);
    place(el, Math.random() * (GW + PAD * 2 - pw), Math.random() * (GH + PAD * 2 - ph));
  });
  checkWin();
}

function place(el, x, y){ el.style.left = x + 'px'; el.style.top = y + 'px'; }

/**
 * The finish is the only feedback. A running count of pieces in place answered
 * the puzzle as you went: drop a piece anywhere and the number told you whether
 * you had guessed right.
 */
function checkWin(){
  const done = pieces.every(p => p.classList.contains('set'));
  if (done){
    if (won) return;
    won = true;
    $('#status').textContent = 'Finished.';
    $('#status').className = 'note ok';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.win();
    confetti();
  } else {
    won = false;
    $('#status').textContent = '';
    $('#status').className = 'note';
  }
}

/** A burst from the middle of the finished picture. Canvas, so no library and no CSP trouble. */
function confetti(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = document.createElement('canvas');
  c.className = 'confetti';
  c.setAttribute('aria-hidden', 'true');
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  document.body.appendChild(c);
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const b = board.getBoundingClientRect();
  const ox = b.left + b.width / 2, oy = b.top + b.height / 2;
  const COLOURS = ['#e4384f', '#49c5b1', '#f2b134', '#5fd68a', '#ece9f5'];
  const bits = [];
  for (let i = 0; i < 150; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 4 + Math.random() * 10;
    bits.push({
      x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      s: 4 + Math.random() * 7, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.34,
      col: COLOURS[i % COLOURS.length]
    });
  }
  const LIFE = 2800;
  const start = performance.now();
  function frame(now){
    const t = now - start;
    x.clearRect(0, 0, w, h);
    x.globalAlpha = Math.max(0, 1 - t / LIFE);
    bits.forEach(p => {
      p.vy += 0.17; p.vx *= 0.995;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      x.save();
      x.translate(p.x, p.y); x.rotate(p.rot);
      x.fillStyle = p.col;
      x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      x.restore();
    });
    if (t < LIFE) requestAnimationFrame(frame); else c.remove();
  }
  requestAnimationFrame(frame);
}

let drag = null, offX = 0, offY = 0;
board.addEventListener('pointerdown', e => {
  const el = e.target.closest('.piece');
  if (!el) return;
  drag = el;
  detach(el);              // its cell is free the moment it is lifted
  el.classList.add('drag');
  el.setPointerCapture(e.pointerId);
  const b = board.getBoundingClientRect();
  offX = e.clientX - b.left - parseFloat(el.style.left);
  offY = e.clientY - b.top - parseFloat(el.style.top);
  checkWin();
});
board.addEventListener('pointermove', e => {
  if (!drag) return;
  const b = board.getBoundingClientRect();
  place(drag, e.clientX - b.left - offX, e.clientY - b.top - offY);
});
board.addEventListener('pointerup', () => {
  if (!drag) return;
  const el = drag; drag = null;
  el.classList.remove('drag');
  const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
  const c = Math.min(N - 1, Math.max(0, Math.round((x - PAD) / pw)));
  const r = Math.min(N - 1, Math.max(0, Math.round((y - PAD) / ph)));
  const cell = r * N + c;
  // Any piece may take any cell, but only if that cell is empty.
  if (Math.abs(x - cellX(c)) <= TOL && Math.abs(y - cellY(r)) <= TOL && !filled.has(cell)){
    place(el, cellX(c), cellY(r));
    el.dataset.cell = cell;
    filled.add(cell);
    el.classList.add('snapped');
    if (cell === Number(el.dataset.home)) el.classList.add('set');
  }
  checkWin();
});

$('#scatter').addEventListener('click', scatter);
$('#ghost').addEventListener('click', () => {
  let g = board.querySelector('.ghostimg');
  if (g){ g.remove(); return; }
  g = document.createElement('div');
  g.className = 'ghostimg';
  g.style.backgroundImage = 'url(' + DATA.img + ')';
  g.style.backgroundSize = W + 'px ' + H + 'px';
  g.style.left = PAD + 'px'; g.style.top = PAD + 'px';
  g.style.width = GW + 'px'; g.style.height = GH + 'px';
  board.insertBefore(g, board.firstChild);
});

make();

</script>


</body></html>
