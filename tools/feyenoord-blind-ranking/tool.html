<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Feyenoord - Blind Ranking</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}

.arena{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,42%);align-items:start}
.arena .stage{order:2;position:sticky;top:12px}
.arena .ladder{order:1}
/* Portrait counts as narrow whatever the width: on a tall screen the picture
   wants to be above the ladder, not squeezed beside it. */
@media (max-width:880px),(orientation:portrait){
  .arena{grid-template-columns:minmax(0,1fr)}
  .arena .stage{order:1;position:static}
  .arena .ladder{order:2}
}
.shot{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;border-radius:12px;
  border:1px solid var(--line);background:#0e0d13;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot.spin img{filter:saturate(.65) brightness(.8);opacity:.9}
.veil{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);
  letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;color:var(--ink);
  background:rgba(14,13,19,.58);text-align:center;padding:10px}
.shotcap{margin-top:10px;font-size:1.06rem;font-weight:700;text-align:center;
  min-height:1.6em;word-break:break-word}
.shotcap.dim{color:var(--dim);font-weight:400;font-size:.88rem}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;
  background:#191822;padding:7px;min-height:64px;width:100%}
.slot .n{flex:0 0 44px;align-self:stretch;min-height:46px;border-radius:9px;background:#131219;
  display:grid;place-items:center;font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--dim)}
.slot.full .n{background:var(--hot);color:#fff}
.slot.gold .n{background:var(--gold);color:#14131a}
.slot .th{flex:0 0 48px;height:48px;border-radius:7px;overflow:hidden;background:#0e0d13}
.slot .th img{width:100%;height:100%;object-fit:cover;display:block}
.slot .lab{flex:1 1 auto;min-width:0;font-size:.93rem;word-break:break-word;line-height:1.3}
.slot .edge{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}
.slot .hint{color:var(--dim)}
button.slot{font:inherit;text-align:left;text-transform:none;letter-spacing:0;color:var(--ink);
  background:#191822;border:1px dashed var(--line);cursor:pointer}
button.slot:hover{filter:none;border-color:var(--cool);border-style:solid;background:#1e1d29}
button.slot:hover .n{color:var(--cool)}
button.slot[disabled]{opacity:.45;cursor:default;border-style:dashed}
button.slot:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.creds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.creds li{display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--dim)}
.creds img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:0 0 auto}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> Feyenoord - Blind Ranking</h1>
<div class="sub">One at a time, sight unseen</div></header>

<div class="panel">
  <div class="arena">
    <div class="stage">
      <div class="shot" id="shot"><img alt="" id="shotimg"><div class="veil" id="veil">Press start</div></div>
      <div class="shotcap dim" id="shotcap">You will not see it coming.</div>
      <div class="row" style="margin-top:12px;justify-content:center">
        <button id="btnStart">Start</button>
        <span class="note" id="status" role="status"></span>
      </div>
    </div>
    <div class="ladder">
      <ol class="slots" id="slots"></ol>
    </div>
  </div>
</div>
<div class="panel hidden" id="endPanel">
  <h2>Are you happy with your ranking?</h2>
  <p class="note" id="endNote" style="margin-top:0"></p>
  <div class="row" id="askRow">
    <button id="btnHappy" class="cool">Yes, that is my ranking</button>
    <button id="btnRedo" class="ghost">No, rank it again</button>
  </div>
  <div class="row hidden" id="saveRow">
    <button id="btnPng">Download as a picture</button>
    <button id="btnAgain" class="ghost">Play again</button>
    <span class="note" id="saveNote"></span>
  </div>
</div>
<div class="panel hidden" id="credsPanel">
  <h2>Pictures</h2>
  <ol class="creds" id="creds"></ol>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>

function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(key){ return {
  get(f){ try { const v = localStorage.getItem(key); return v===null?f:JSON.parse(v); } catch(e){ return f; } },
  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }


const POOL = DATA.items || [];
const RANKS = Math.max(2, Math.min(DATA.ranks || 5, POOL.length));
const TOP = String(DATA.topLabel || '');
const BOT = String(DATA.bottomLabel || '');
const runs = store('blindrank:' + DATA.title);

let queue = [], slots = [], cur = null, at = 0, busy = false, done = false, started = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function labelFor(it, i){
  if (!it) return 'Rank ' + (i + 1);
  return String(it.cap || '').trim() || 'Picture ' + (POOL.indexOf(it) + 1);
}

function edgeFor(i){ return i === 0 ? TOP : (i === RANKS - 1 ? BOT : ''); }

/* ── the ladder ── */

function renderSlots(){
  const ol = $('#slots');
  ol.replaceChildren();
  for (let i = 0; i < RANKS; i++){
    const li = document.createElement('li');
    const it = slots[i];
    const edge = edgeFor(i);
    if (it){
      const d = document.createElement('div');
      d.className = 'slot full' + (i === 0 ? ' gold' : '');
      d.innerHTML = '<span class="n">' + (i + 1) + '</span>'
        + '<span class="th"><img alt=""></span>'
        + '<span class="lab">' + esc(labelFor(it, i))
        + (edge ? '<span class="edge">' + esc(edge) + '</span>' : '') + '</span>';
      // Assigned rather than interpolated: a data URI is long and does not want
      // to go through HTML escaping twice.
      d.querySelector('img').src = it.img;
      li.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot';
      b.disabled = busy || done || !cur;
      b.innerHTML = '<span class="n">' + (i + 1) + '</span>'
        + '<span class="lab"><span class="hint">'
        + (cur ? 'Put it here' : (started ? 'Waiting' : 'Empty'))
        + '</span>' + (edge ? '<span class="edge">' + esc(edge) + '</span>' : '') + '</span>';
      b.setAttribute('aria-label', cur
        ? 'Place ' + labelFor(cur, i) + ' at rank ' + (i + 1) + (edge ? ', ' + edge : '')
        : 'Rank ' + (i + 1) + ' is empty' + (edge ? ', ' + edge : ''));
      b.addEventListener('click', function(){ place(i); });
      li.appendChild(b);
    }
    ol.appendChild(li);
  }
}

function paintStatus(){
  const filled = slots.filter(Boolean).length;
  if (done){ $('#status').textContent = 'Ranking complete.'; return; }
  if (!started){ $('#status').textContent = RANKS + ' places to fill.'; return; }
  $('#status').textContent = busy
    ? 'Finding one...'
    : 'Place ' + (filled + 1) + ' of ' + RANKS + '.';
}

/* ── the reel ── */

function reveal(){
  busy = true; cur = null;
  renderSlots(); paintStatus();
  const target = queue[at];
  const img = $('#shotimg'), veil = $('#veil'), cap = $('#shotcap');
  $('#shot').classList.add('spin');
  veil.classList.remove('hidden');
  veil.textContent = 'Shuffling';
  cap.className = 'shotcap dim';
  cap.textContent = 'Wherever it lands, you decide where it goes.';
  // Fast, and it stops rather than easing to a halt. A long deceleration is the
  // obvious way to build suspense and it is wrong here: hold a frame for a third
  // of a second and the player reads it, so the last pictures before the landing
  // become a tell. Nothing here is held long enough to recognise. Reduced motion
  // gets the stop without the reel at all — a strobe of twenty pictures is
  // exactly what that setting is asking about.
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const steps = reduced ? [360] : [36,36,36,36,36,36,36,36,36,36,36,36,36,36,42,52,66,84];
  let k = 0;
  function tick(){
    if (k >= steps.length){ land(target); return; }
    if (!reduced) img.src = POOL[Math.floor(Math.random() * POOL.length)].img;
    setTimeout(tick, steps[k++]);
  }
  tick();
}

function land(it){
  cur = it; busy = false;
  const img = $('#shotimg');
  img.src = it.img;
  img.alt = labelFor(it, at);
  $('#shot').classList.remove('spin');
  $('#veil').classList.add('hidden');
  const cap = $('#shotcap');
  cap.className = 'shotcap';
  cap.textContent = labelFor(it, at);
  renderSlots(); paintStatus();
}

function place(i){
  if (busy || done || !cur || slots[i]) return;
  slots[i] = cur;
  cur = null;
  at++;
  renderSlots(); paintStatus();
  if (at >= RANKS) finish();
  else setTimeout(reveal, 300);
}

/* ── start, finish, again ── */

function newGame(){
  queue = shuffle(POOL.slice()).slice(0, RANKS);
  slots = new Array(RANKS).fill(null);
  cur = null; at = 0; done = false; started = true;
  $('#endPanel').classList.add('hidden');
  $('#askRow').classList.remove('hidden');
  $('#saveRow').classList.add('hidden');
  $('#saveNote').textContent = '';
  $('#btnStart').classList.add('hidden');
  renderSlots();
  reveal();
}

function finish(){
  done = true; busy = false; cur = null;
  const n = (runs.get(0) || 0) + 1;
  runs.set(n);
  const first = slots[0];
  const img = $('#shotimg');
  if (first){ img.src = first.img; img.alt = labelFor(first, 0); }
  $('#shot').classList.remove('spin');
  $('#veil').classList.add('hidden');
  const cap = $('#shotcap');
  cap.className = 'shotcap';
  cap.textContent = (TOP ? TOP + ': ' : 'Number one: ') + labelFor(first, 0);
  $('#endNote').textContent = 'All ' + RANKS + ' places are filled'
    + (POOL.length > RANKS
        ? ', out of ' + POOL.length + ' pictures. Go again and it will be a different set.'
        : '.')
    + ' This is ranking number ' + n + ' on this device.';
  $('#endPanel').classList.remove('hidden');
  renderSlots(); paintStatus();
  $('#btnHappy').focus();
}

/* ── the picture of the ranking ── */

function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) || 'ranking';
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function drawCover(g, im, x, y, w, h){
  const k = Math.max(w / im.width, h / im.height);
  const dw = im.width * k, dh = im.height * k;
  g.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

function fit(g, text, max){
  let s = String(text);
  if (g.measureText(s).width <= max) return s;
  while (s.length > 1 && g.measureText(s + '...').width > max) s = s.slice(0, -1);
  return s + '...';
}

/* The pictures are already data URIs, so nothing here taints the canvas and
   toBlob will not throw the way it would on a blob URL at file://. */
function withImages(list, cb){
  const out = [];
  let left = list.length;
  if (!left){ cb(out); return; }
  list.forEach(function(it, i){
    const im = new Image();
    im.onload = im.onerror = function(){ out[i] = im; if (--left === 0) cb(out); };
    im.src = it.img;
  });
}

function savePng(){
  const note = $('#saveNote');
  note.textContent = 'Drawing...';
  note.className = 'note';
  withImages(slots.filter(Boolean), function(imgs){
    const W = 920, PAD = 30, ROW = 104, GAP = 12, HEAD = 112, FOOT = 46;
    const H = HEAD + RANKS * (ROW + GAP) + FOOT;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const MONO = 'ui-monospace, Menlo, Consolas, monospace';
    const SANS = 'system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif';

    g.fillStyle = '#14131a'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#e4384f'; g.fillRect(0, 0, W, 7);
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#ece9f5';
    g.font = '700 30px ' + MONO;
    g.fillText(fit(g, DATA.title || 'My ranking', W - PAD * 2), PAD, 64);
    g.fillStyle = '#918cab';
    g.font = '15px ' + SANS;
    g.fillText(fit(g, DATA.tagline || 'Ranked blind, one picture at a time.', W - PAD * 2), PAD, 90);

    let y = HEAD;
    for (let i = 0; i < RANKS; i++){
      g.fillStyle = '#1d1c26';
      roundRect(g, PAD, y, W - PAD * 2, ROW, 12); g.fill();
      g.strokeStyle = '#312f3f'; g.lineWidth = 1; g.stroke();

      g.fillStyle = i === 0 ? '#f2b134' : '#312f3f';
      roundRect(g, PAD + 14, y + 16, 58, ROW - 32, 10); g.fill();
      g.fillStyle = i === 0 ? '#14131a' : '#ece9f5';
      g.font = '700 26px ' + MONO;
      g.textAlign = 'center';
      g.fillText(String(i + 1), PAD + 43, y + ROW / 2 + 10);
      g.textAlign = 'left';

      const tx = PAD + 88, ty = y + 12, ts = ROW - 24;
      g.save();
      roundRect(g, tx, ty, ts, ts, 9); g.clip();
      g.fillStyle = '#0e0d13'; g.fillRect(tx, ty, ts, ts);
      const im = imgs[i];
      if (im && im.width) drawCover(g, im, tx, ty, ts, ts);
      g.restore();

      const lx = tx + ts + 18;
      const room = W - PAD - 16 - lx;
      const edge = edgeFor(i);
      g.fillStyle = '#ece9f5';
      g.font = '600 20px ' + SANS;
      g.fillText(fit(g, labelFor(slots[i], i), room), lx, y + ROW / 2 + (edge ? 0 : 8));
      if (edge){
        g.fillStyle = '#918cab';
        g.font = '13px ' + MONO;
        g.fillText(fit(g, edge.toUpperCase(), room), lx, y + ROW / 2 + 24);
      }
      y += ROW + GAP;
    }

    g.fillStyle = '#918cab';
    g.font = '13px ' + MONO;
    g.fillText('Ranked blind - each picture placed before the next was seen', PAD, H - 18);

    if (!c.toBlob){
      note.textContent = 'This browser cannot save a canvas as a file.';
      note.className = 'note bad';
      return;
    }
    c.toBlob(function(b){
      if (!b){
        note.textContent = 'The browser refused to make the picture.';
        note.className = 'note bad';
        return;
      }
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url;
      a.download = slugify(DATA.title || 'ranking') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      note.textContent = 'Saved as a picture.';
      note.className = 'note ok';
    }, 'image/png');
  });
}

/* ── credits, wiring ── */

function credits(){
  const with_ = POOL.filter(function(p){ return String(p.credit || '').trim(); });
  if (!with_.length) return;
  const ol = $('#creds');
  with_.forEach(function(p){
    const li = document.createElement('li');
    li.innerHTML = '<img alt=""><span></span>';
    li.querySelector('img').src = p.img;
    li.querySelector('span').textContent =
      (String(p.cap || '').trim() ? String(p.cap).trim() + ' - ' : '') + String(p.credit).trim();
    ol.appendChild(li);
  });
  $('#credsPanel').classList.remove('hidden');
}

/* Number keys place into a rank, which is faster than hunting for the button
   and is the only way the game is playable one-handed on a keyboard. */
document.addEventListener('keydown', function(ev){
  if (busy || done || !cur) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (!/^[0-9]$/.test(ev.key)) return;
  const n = ev.key === '0' ? 10 : Number(ev.key);
  if (n < 1 || n > RANKS) return;
  ev.preventDefault();
  place(n - 1);
});

$('#btnStart').addEventListener('click', newGame);
$('#btnRedo').addEventListener('click', newGame);
$('#btnAgain').addEventListener('click', newGame);
$('#btnHappy').addEventListener('click', function(){
  $('#askRow').classList.add('hidden');
  $('#saveRow').classList.remove('hidden');
  $('#endNote').textContent = 'Ranking kept. Save it as a picture, or go again for a new set.';
  $('#btnPng').focus();
});
$('#btnPng').addEventListener('click', savePng);

slots = new Array(RANKS).fill(null);
renderSlots();
paintStatus();
credits();

</script>
