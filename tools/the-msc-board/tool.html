<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>The Board</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}@media (hover:none){input,textarea,select{font-size:16px}}

.board{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.tile{
  background:#262431;border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  font-family:var(--mono);font-size:.86rem;cursor:pointer;color:var(--ink);text-align:left;
}
.tile:hover{border-color:var(--cool)}
.tile.picked{border-color:var(--gold);color:var(--gold)}
.tile.right{border-color:var(--ok);color:var(--ok)}
.tile.wrong{border-color:var(--bad);color:var(--bad)}
.tile.gone{opacity:.28;pointer-events:none}
.bigq{font-size:1.1rem;margin:2px 0 14px;line-height:1.4}
.meter{height:6px;background:#262431;border-radius:3px;overflow:hidden;margin:10px 0}
.meter > div{height:100%;background:var(--cool);width:0;transition:width .3s}
.scoreline{font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

.jb{display:grid;gap:6px}
.jb .cat{background:#1a1830;border:1px solid var(--line);border-radius:7px;padding:10px 6px;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;color:var(--cool);display:grid;place-items:center;min-height:52px}
.jb .val{background:#232135;border:1px solid var(--line);border-radius:7px;min-height:56px;
  font-family:var(--mono);font-size:1.2rem;color:var(--gold);cursor:pointer;display:grid;place-items:center}
.jb .val:hover{border-color:var(--cool)}
.jb .val.spent{background:#191822;color:#33313f;cursor:default;border-color:#232130}
.ask{margin-top:14px}
.askq{font-size:1.1rem;line-height:1.4;margin:6px 0 14px}
.wager{max-width:180px}
@media (max-width:640px){.jb .val{font-size:.95rem;min-height:44px}.jb .cat{font-size:.58rem}}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> The Board</h1>
<div class="sub">Choose a category and a value</div></header>

<div class="panel">
  <div class="scoreline">score <span id="score">0</span></div>
  <div class="jb" id="board" style="margin-top:10px"></div>
</div>
<div class="panel hidden ask" id="ask">
  <div class="scoreline" id="askhead"></div>
  <p class="askq" id="askq"></p>
  <div class="answers" id="answers" style="display:grid;gap:8px;max-width:560px"></div>
  <p class="note" id="why"></p>
  <div class="row" style="margin-top:8px"><button id="back" class="cool hidden">Back to the board</button></div>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>
<script>
const DATA = {"title":"The Board","categories":[{"name":"ALBUMS","clues":[{"value":100,"q":"Which 1996 album contains A Design for Life?","a":"Everything Must Go","wrong":["The Holy Bible","Know Your Enemy","Lifeblood"],"why":""},{"value":200,"q":"Which album was their first UK number one?","a":"This Is My Truth Tell Me Yours","wrong":["Everything Must Go","Futurology","Send Away the Tigers"],"why":""},{"value":300,"q":"Which 2009 album used lyrics left by Richey Edwards?","a":"Journal for Plague Lovers","wrong":["Postcards from a Young Man","Lifeblood","Rewind the Film"],"why":""},{"value":400,"q":"Which album reached number one twenty-three years after their first?","a":"The Ultra Vivid Lament","wrong":["Resistance Is Futile","Critical Thinking","Futurology"],"why":""}]},{"name":"PEOPLE","clues":[{"value":100,"q":"Who plays lead guitar and sings?","a":"James Dean Bradfield","wrong":["Nicky Wire","Sean Moore","Richey Edwards"],"why":""},{"value":200,"q":"Who plays trumpet as well as drums?","a":"Sean Moore","wrong":["Nicky Wire","Dave Eringa","James Dean Bradfield"],"why":""},{"value":300,"q":"Who recorded Journal for Plague Lovers?","a":"Steve Albini","wrong":["Dave Eringa","Flood","Steven Wilson"],"why":""},{"value":400,"q":"Who was the bassist before Nicky Wire?","a":"Miles Flicker Woodward","wrong":["Sean Moore","Richey Edwards","Cian Ciaran"],"why":""}]},{"name":"PLACES","clues":[{"value":100,"q":"Which South Wales town were they formed in?","a":"Blackwood","wrong":["Newport","Merthyr Tydfil","Cardiff"],"why":""},{"value":200,"q":"Where did they play on New Year’s Eve 1999?","a":"Millennium Stadium","wrong":["Cardiff Castle","Wembley","Nynex Arena"],"why":""},{"value":300,"q":"Which Havana theatre did they play in 2001?","a":"Karl Marx Theatre","wrong":["Gran Teatro","Teatro Nacional","Estadio Latinoamericano"],"why":""},{"value":400,"q":"The Holy Bible anniversary shows were at which London venue?","a":"The Roundhouse","wrong":["The Astoria","Brixton Academy","Alexandra Palace"],"why":""}]},{"name":"SLEEVES","clues":[{"value":100,"q":"Which painter made the cover of The Holy Bible?","a":"Jenny Saville","wrong":["Tracey Emin","Peter Blake","Gillian Wearing"],"why":""},{"value":200,"q":"Which album did supermarkets sleeve in plain packaging?","a":"Journal for Plague Lovers","wrong":["The Holy Bible","Know Your Enemy","Gold Against the Soul"],"why":""},{"value":300,"q":"Which Saville painting is on The Holy Bible?","a":"Strategy","wrong":["Stare","Propped","Branded"],"why":""},{"value":400,"q":"Which beach appears on This Is My Truth Tell Me Yours?","a":"Black Rock Sands","wrong":["Rhossili","Barafundle","Three Cliffs"],"why":""}]}],"total":16};
function esc(s){ return String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(key){ return {
  get(f){ try { const v = localStorage.getItem(key); return v===null?f:JSON.parse(v); } catch(e){ return f; } },
  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }

const AudioKit = (() => {
  let ctx = null;
  const NOTES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** "A4" | "F#3" -> Hz. Returns 0 for a rest. */
  function freq(note){
    if (!note || note === 'r' || note === 'R') return 0;
    const m = String(note).match(/^([A-Ga-g])([#b]?)(-?\d)$/);
    if (!m) return 0;
    const semi = NOTES[m[1].toUpperCase() + m[2]];
    if (semi === undefined) return 0;
    return 440 * Math.pow(2, (semi - 9) / 12 + (Number(m[3]) - 4));
  }

  /** One note. type: square | triangle | sawtooth | sine */
  function beep(note, dur, opts){
    const c = ac(); if (!c) return;
    const o = opts || {};
    const f = typeof note === 'number' ? note : freq(note);
    if (!f) return;
    const t = c.currentTime;
    const d = dur || 0.18;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


const spent = new Set();
let score = 0, current = null;

function draw(){
  const b = $('#board');
  b.replaceChildren();
  b.style.gridTemplateColumns = 'repeat(' + DATA.categories.length + ', 1fr)';
  DATA.categories.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cat';
    d.textContent = c.name;
    b.appendChild(d);
  });
  const depth = Math.max.apply(null, DATA.categories.map(c => c.clues.length));
  for (let row = 0; row < depth; row++){
    DATA.categories.forEach((c, ci) => {
      const clue = c.clues[row];
      const key = ci + ':' + row;
      const d = document.createElement('button');
      d.type = 'button';
      if (!clue){ d.className = 'val spent'; d.textContent = ''; b.appendChild(d); return; }
      d.className = 'val' + (spent.has(key) ? ' spent' : '');
      d.textContent = spent.has(key) ? '' : clue.value;
      if (!spent.has(key)) d.addEventListener('click', () => open(ci, row));
      b.appendChild(d);
    });
  }
  $('#score').textContent = score;
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function open(ci, row){
  const clue = DATA.categories[ci].clues[row];
  current = { ci: ci, row: row, clue: clue };
  spent.add(ci + ':' + row);
  $('#ask').classList.remove('hidden');
  $('#askhead').textContent = DATA.categories[ci].name + ' for ' + clue.value;
  $('#askq').textContent = clue.q;
  $('#why').textContent = '';
  $('#back').classList.add('hidden');
  const box = $('#answers');
  box.replaceChildren();
  shuffle([clue.a].concat(clue.wrong)).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'tile'; btn.type = 'button'; btn.textContent = opt;
    btn.addEventListener('click', () => answer(btn, opt));
    box.appendChild(btn);
  });
  $('#ask').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function answer(btn, opt){
  if ($('#back').classList.contains('hidden') === false) return;
  const right = opt === current.clue.a;
  $$('#answers .tile').forEach(t => {
    t.style.pointerEvents = 'none';
    if (t.textContent === current.clue.a) t.classList.add('right');
  });
  if (right){ score += current.clue.value; if (typeof AudioKit !== 'undefined') AudioKit.sfx.good(); }
  else { btn.classList.add('wrong'); score -= current.clue.value;
         if (typeof AudioKit !== 'undefined') AudioKit.sfx.bad(); }
  if (current.clue.why) $('#why').textContent = current.clue.why;
  $('#back').classList.remove('hidden');
  draw();
  if (spent.size === DATA.total){
    $('#why').textContent = (current.clue.why ? current.clue.why + ' ' : '')
      + 'That is the whole board. Final score ' + score + '.';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.win();
  }
}

$('#back').addEventListener('click', () => {
  $('#ask').classList.add('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

draw();

</script>


</body></html>
