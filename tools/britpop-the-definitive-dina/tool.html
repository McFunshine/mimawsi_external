<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BRITPOP - The Definitive Dina!</title>
<style>
:root{--cell:96px;--cap:11px;--label-w:96px;--label-fs:20px;
  --bg:#0f0f10;--panel:#1b1b1d;--ink:#f2f2f3;--dim:#8b8b90;--accent:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;
  border-bottom:1px solid #2a2a2e;position:sticky;top:0;z-index:5;background:var(--bg)}
header h1{font-size:19px;margin:0;flex:1 1 auto}
.hud{color:var(--dim);font-size:12px;white-space:nowrap}
.actions{display:flex;gap:8px}
button{font:inherit;color:var(--ink);background:#2a2a2e;border:1px solid #3d3d44;border-radius:6px;
  padding:6px 11px;cursor:pointer}
button:hover{background:#35353b}
button.danger:hover{background:#5a1f1f;border-color:#7a2a2a}
main{padding:14px;max-width:1500px;margin:0 auto}

#tiers{border:1px solid #000;background:#000}
.tier{display:flex;align-items:stretch;border-bottom:1px solid #000;background:var(--panel)}
.tier:last-child{border-bottom:0}
.tier .label{flex:0 0 var(--label-w);width:var(--label-w);min-height:calc(var(--cell) + 20px);
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;
  font-size:var(--label-fs);line-height:1.1;color:#151515;padding:6px;overflow-wrap:anywhere;hyphens:auto}
.items{flex:1 1 auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:3px;
  min-height:calc(var(--cell) + 20px)}
.items.over{background:#26262b}
.item{margin:0;width:var(--cell);background:#000;border:1px solid #2c2c31;border-radius:3px;
  display:flex;flex-direction:column;overflow:hidden;cursor:grab;
  touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item img{width:100%;height:var(--cell);object-fit:contain;display:block;background:#121214;pointer-events:none}
.item .cap{font-size:var(--cap);line-height:1.15;padding:3px 2px;text-align:center;color:#dcdce0;
  min-height:calc(var(--cap) + 7px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.item.ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;cursor:grabbing;opacity:.92;
  rotate:-3deg;box-shadow:0 8px 22px rgba(0,0,0,.65)}
.slot{width:var(--cell);height:calc(var(--cell) + var(--cap) + 9px);flex:0 0 auto;border-radius:3px;
  border:2px dashed var(--accent);background:rgba(255,209,102,.12)}

#queueWrap{margin-top:18px}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0 0 6px}
.qhead h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.qhead .hint{color:var(--dim);font-size:12px}
#queue{border:1px dashed #3a3a40;border-radius:6px;background:#141416;min-height:calc(var(--cell) + 28px)}
.done{color:var(--dim);font-size:13px;padding:12px;align-self:center}

dialog{border:1px solid #3d3d44;border-radius:10px;background:var(--panel);color:var(--ink);padding:0;
  width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.dlg img{max-width:100%;max-height:46vh;border-radius:6px;background:#000}
.dlg .cap{font-size:16px;font-weight:600}
.dlg .credit{font-size:12px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a2a2e;
  border:1px solid #45454c;border-radius:8px;padding:9px 14px;z-index:1000;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:min(92vw,520px)}
#toast[hidden]{display:none}
#credits{display:none}

@media print{
  @page{margin:10mm}
  html,body{background:#fff;color:#000}
  header{position:static;border:0;padding:0 0 8px;background:#fff}
  header h1{font-size:18pt;color:#000}
  .actions,.hud,#queueWrap,#toast,dialog{display:none !important}
  main{padding:0;max-width:none}
  #tiers{border:1px solid #444}
  .tier{background:#fff;border-bottom:1px solid #444;break-inside:avoid;page-break-inside:avoid}
  .tier .label{color:#111;min-height:calc(var(--cell) * .62)}
  .items{background:#fff;min-height:calc(var(--cell) * .62)}
  .item{background:#fff;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  .item .cap{color:#000}
  .slot{display:none}
  #credits{display:block;margin-top:9mm;font-size:8pt;color:#333;page-break-inside:avoid}
  #credits h2{font-size:9pt;margin:0 0 3px;text-transform:uppercase;letter-spacing:.06em}
  #credits ul{margin:0;padding-left:16px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="hud" id="progress"></span>
  <div class="actions">
    <button id="saveBtn">Download image</button>
    <button id="resetBtn" class="danger">Reset</button>
  </div>
</header>
<main>
  <section id="tiers"></section>
  <section id="queueWrap">
    <div class="qhead"><h2>Unranked</h2><span class="hint" id="qcount"></span>
      <span class="hint">Drag an item onto a tier. Drop it between two others to place it exactly.</span></div>
    <div id="queue" class="items" data-list="q"></div>
  </section>
  <section id="credits"></section>
</main>
<dialog id="info"><div class="dlg">
  <img id="infoImg" alt="">
  <div class="cap" id="infoCap"></div>
  <div class="credit" id="infoCredit"></div>
  <button id="infoClose">Close</button>
</div></dialog>

  fig.title = (it.caption || "") + (it.credit ? "\n" + it.credit : "");
  var img = document.createElement("img");
  img.src = it.src; img.alt = it.caption || ""; img.draggable = false;
  var cap = document.createElement("figcaption");
  cap.className = "cap"; cap.textContent = it.caption || "";
  fig.appendChild(img); fig.appendChild(cap);
  nodes[i] = fig;
  return fig;
}

/* ---- sizing follows the content: how many items, how long the tier names ---- */
function resize(){
  var n = D.items.length;
  var base = n <= 10 ? 112 : n <= 20 ? 104 : n <= 32 ? 94 : n <= 48 ? 84 : n <= 72 ? 72 : n <= 110 ? 62 : 54;
  var longest = 1;
  D.tiers.forEach(function(t){ longest = Math.max(longest, (t.name || "").length); });
  var lw = Math.min(200, Math.max(58, longest * 9 + 26));
  var avail = (document.querySelector("main").clientWidth || 900) - lw - 12;
  var cell = Math.max(44, Math.min(base, Math.floor(avail / 4) - 6));   /* never fewer than 4 per row */
  root.style.setProperty("--cell", cell + "px");
  root.style.setProperty("--cap", Math.max(8, Math.min(12, Math.round(cell / 8))) + "px");
  root.style.setProperty("--label-w", lw + "px");
  root.style.setProperty("--label-fs",
    (longest <= 2 ? Math.max(18, Math.min(30, Math.round(cell / 3.4)))
     : longest <= 6 ? 16 : longest <= 14 ? 13 : 12) + "px");
}

/* ---- render ---- */
function render(){
  tiersEl.textContent = "";
  D.tiers.forEach(function(t, ti){
    var row = document.createElement("div");
    row.className = "tier";
    var label = document.createElement("div");
    label.className = "label";
    label.style.background = t.color;
    label.textContent = t.name;
    var items = document.createElement("div");
    items.className = "items";
    items.dataset.list = String(ti);
    place.rows[ti].forEach(function(i){ items.appendChild(nodeFor(i)); });
    row.appendChild(label); row.appendChild(items);
    tiersEl.appendChild(row);
  });

  queueEl.textContent = "";
  place.queue.forEach(function(i){ queueEl.appendChild(nodeFor(i)); });
  if (!place.queue.length){
    var d = document.createElement("span");
    d.className = "done";
    d.textContent = "Everything is ranked. Print it, or drag things back out to change your mind.";
    queueEl.appendChild(d);
  }
  var ranked = D.items.length - place.queue.length;
  byId("progress").textContent = ranked + " of " + D.items.length + " ranked";
  byId("qcount").textContent = place.queue.length + " left";
}

/* ---- drag: mouse, pen, and touch after a short hold so swipes still scroll ---- */
var drag = null, LONGPRESS = 220;

function containerAt(x, y){
  var el = document.elementFromPoint(x, y);
  if (!el || !el.closest) return null;
  return el.closest(".items") || (el.closest(".tier") && el.closest(".tier").querySelector(".items"))
      || (el.closest("#queueWrap") ? queueEl : null);
}

function refBefore(box, x, y){
  var kids = Array.prototype.filter.call(box.children, function(k){
    return k.classList.contains("item") && k !== drag.slot;
  });
  if (!kids.length) return null;
  var rows = [];
  kids.forEach(function(k){
    var r = k.getBoundingClientRect(), row = null;
    for (var i = 0; i < rows.length; i++) if (Math.abs(rows[i].top - r.top) < 6) { row = rows[i]; break; }
    if (!row) { row = { top: r.top, bottom: r.bottom, items: [] }; rows.push(row); }
    row.bottom = Math.max(row.bottom, r.bottom);
    row.items.push({ el: k, r: r });
  });
  var row = null;
  for (var i = 0; i < rows.length; i++) if (y >= rows[i].top - 3 && y <= rows[i].bottom + 3) { row = rows[i]; break; }
  if (!row) { if (y < rows[0].top) row = rows[0]; else return null; }
  for (var j = 0; j < row.items.length; j++)
    if (x < row.items[j].r.left + row.items[j].r.width / 2) return row.items[j].el;
  return kids[kids.indexOf(row.items[row.items.length - 1].el) + 1] || null;
}

function startDrag(el, ev){
  var r = el.getBoundingClientRect();
  drag.started = true;
  drag.dx = ev.clientX - r.left; drag.dy = ev.clientY - r.top;
  drag.slot = document.createElement("div");
  drag.slot.className = "slot";
  el.parentNode.insertBefore(drag.slot, el);
  el.classList.add("ghost");
  el.style.width = r.width + "px";
  document.body.appendChild(el);
  moveGhost(ev.clientX, ev.clientY);
  document.body.style.cursor = "grabbing";
}
function moveGhost(x, y){ drag.el.style.transform = "translate(" + (x - drag.dx) + "px," + (y - drag.dy) + "px)"; }

function dropCandidate(){
  if (!drag) return;
  clearTimeout(drag.timer);
  document.removeEventListener("pointermove", onMove);
  document.removeEventListener("pointerup", onUp);
  document.removeEventListener("pointercancel", onCancel);
  drag = null;
}

function onMove(ev){
  if (!drag) return;
  drag.x = ev.clientX; drag.y = ev.clientY;
  if (!drag.started){
    var moved = Math.abs(ev.clientX - drag.x0) + Math.abs(ev.clientY - drag.y0);
    if (drag.touch){ if (moved > 10) dropCandidate(); return; }   /* a swipe: let the page scroll */
    if (moved < 6) return;
    startDrag(drag.el, ev);
  }
  ev.preventDefault();
  moveGhost(ev.clientX, ev.clientY);
  var box = containerAt(ev.clientX, ev.clientY);
  Array.prototype.forEach.call(document.querySelectorAll(".items.over"), function(n){ n.classList.remove("over"); });
  if (box){
    box.classList.add("over");
    var ref = refBefore(box, ev.clientX, ev.clientY);
    if (drag.slot.parentNode !== box || drag.slot.nextSibling !== ref) box.insertBefore(drag.slot, ref);
  }
  var m = 70, h = window.innerHeight;
  if (ev.clientY < m) window.scrollBy(0, -Math.ceil((m - ev.clientY) / 6));
  else if (ev.clientY > h - m) window.scrollBy(0, Math.ceil((ev.clientY - (h - m)) / 6));
}

function endDrag(commit){
  if (!drag) return;
  var el = drag.el, slot = drag.slot;
  clearTimeout(drag.timer);
  document.removeEventListener("pointermove", onMove);
  document.removeEventListener("pointerup", onUp);
  document.removeEventListener("pointercancel", onCancel);
  document.body.style.cursor = "";
  Array.prototype.forEach.call(document.querySelectorAll(".items.over"), function(n){ n.classList.remove("over"); });

  if (!drag.started){                       /* a tap, not a drag */
    var i = +el.dataset.i; drag = null; if (commit) showInfo(i); return;
  }
  el.classList.remove("ghost"); el.style.transform = ""; el.style.width = "";
  var box = slot && slot.parentNode;
  if (commit && box){
    var index = Array.prototype.filter.call(box.children, function(k){
      return k.classList.contains("item") || k === slot;
    }).indexOf(slot);
    var i2 = +el.dataset.i;
    removeEverywhere(i2);
    var list = listOf(box.dataset.list) || place.queue;
    list.splice(Math.max(0, index), 0, i2);
    save();
  }
  if (slot && slot.parentNode) slot.parentNode.removeChild(slot);
  if (el.parentNode) el.parentNode.removeChild(el);
  drag = null;
  render();
}
function onUp(){ endDrag(true); }
function onCancel(){ endDrag(false); }

document.addEventListener("pointerdown", function(ev){
  if (ev.button != null && ev.button !== 0 && ev.pointerType === "mouse") return;
  var el = ev.target.closest && ev.target.closest(".item");
  if (!el || drag) return;
  drag = { el: el, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY,
           started: false, touch: ev.pointerType === "touch", timer: null };
  if (drag.touch) drag.timer = setTimeout(function(){
    if (drag && !drag.started) startDrag(drag.el, { clientX: drag.x, clientY: drag.y });
  }, LONGPRESS);
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
});
document.addEventListener("touchmove", function(ev){ if (drag && drag.started) ev.preventDefault(); },
  { passive: false });
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && drag && drag.started) endDrag(false);
});

/* ---- a tap shows the item full size, with its credit ---- */
function showInfo(i){
  var it = D.items[i], dlg = byId("info");
  byId("infoImg").src = it.src;
  byId("infoImg").alt = it.caption || "";
  byId("infoCap").textContent = it.caption || "";
  byId("infoCredit").textContent = it.credit || "";
  byId("infoCredit").style.display = it.credit ? "" : "none";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
}
byId("infoClose").addEventListener("click", function(){
  var dlg = byId("info");
  if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
});

/* ---- print ---- */
function buildCredits(){
  var box = byId("credits");
  box.textContent = "";
  var groups = {}, order = [];
  place.rows.forEach(function(list){
    list.forEach(function(i){
      var it = D.items[i];
      if (!it.credit) return;
      if (!groups[it.credit]) { groups[it.credit] = []; order.push(it.credit); }
      if (it.caption && groups[it.credit].indexOf(it.caption) < 0) groups[it.credit].push(it.caption);
    });
  });
  if (!order.length) return;
  var h = document.createElement("h2"); h.textContent = "Image credits";
  var ul = document.createElement("ul");
  order.forEach(function(c){
    var li = document.createElement("li");
    li.textContent = (groups[c].length ? groups[c].join(", ") + " — " : "") + c;
    ul.appendChild(li);
  });
  box.appendChild(h); box.appendChild(ul);
}
window.addEventListener("beforeprint", buildCredits);

var toastTimer = null;
function toast(msg, ms){
  var t = byId("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, ms || 3000);
}

/* ---- draw the finished list to a canvas and hand it over as a PNG ---- */
function fitText(c, text, maxW){
  if (c.measureText(text).width <= maxW) return text;
  var t = String(text);
  while (t.length > 1 && c.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}
function wrapLines(c, text, maxW, maxLines){
  var words = String(text || "").split(/\s+/).filter(Boolean), lines = [], cur = "";
  for (var i = 0; i < words.length; i++){
    var t = cur ? cur + " " + words[i] : words[i];
    if (!cur || c.measureText(t).width <= maxW) cur = t;
    else { lines.push(cur); cur = words[i]; if (lines.length === maxLines) break; }
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (!lines.length) return [""];
  if (lines.length === maxLines) lines[maxLines - 1] = fitText(c, lines[maxLines - 1], maxW);
  return lines;
}
function loadImages(){
  return Promise.all(D.items.map(function(it){
    return new Promise(function(res){
      var im = new Image();
      im.onload = function(){ res(im); };
      im.onerror = function(){ res(null); };
      im.src = it.src;          /* a data: URL, so the canvas is never tainted */
    });
  }));
}
var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

function drawList(imgs){
  var W = 1500, GAP = 6, PAD = 6, M = 26;
  var longest = 1;
  D.tiers.forEach(function(t){ longest = Math.max(longest, (t.name || "").length); });
  var labelW = Math.min(320, Math.max(96, longest * 12 + 34));

  var CELL, capH, cols, rowHs, H, tries = [128, 110, 92, 76, 64, 54];
  for (var a = 0; a < tries.length; a++){
    CELL = tries[a];
    capH = Math.max(18, Math.round(CELL / 5.5));
    cols = Math.max(1, Math.floor((W - labelW - PAD) / (CELL + GAP)));
    rowHs = place.rows.map(function(list){
      return Math.max(1, Math.ceil(list.length / cols)) * (CELL + capH + GAP) + PAD;
    });
    H = M + 46 + rowHs.reduce(function(x, y){ return x + y; }, 0) + M;
    if (H <= 9000) break;                   /* stay inside every engine's canvas limit */
  }

  var probe = document.createElement("canvas").getContext("2d");
  probe.font = "12px " + FONT;
  var groups = {}, order = [];
  place.rows.forEach(function(list){
    list.forEach(function(i){
      var it = D.items[i];
      if (!it.credit) return;
      if (!groups[it.credit]) { groups[it.credit] = []; order.push(it.credit); }
      if (it.caption && groups[it.credit].indexOf(it.caption) < 0) groups[it.credit].push(it.caption);
    });
  });
  var creditLines = [];
  order.forEach(function(cr){
    wrapLines(probe, (groups[cr].length ? groups[cr].join(", ") + " — " : "") + cr, W - M * 2, 3)
      .forEach(function(l){ creditLines.push(l); });
  });
  if (creditLines.length) H += 14 + 16 + creditLines.length * 15;

  var scale = (H * 2 <= 9000) ? 2 : 1;      /* 2x when it fits, so the text stays crisp */
  var cv = document.createElement("canvas");
  cv.width = W * scale; cv.height = H * scale;
  var c = cv.getContext("2d");
  c.scale(scale, scale);
  c.textBaseline = "top";

  c.fillStyle = "#0f0f10"; c.fillRect(0, 0, W, H);
  c.fillStyle = "#f2f2f3"; c.font = "700 26px " + FONT;
  c.fillText(fitText(c, D.title, W - M * 2), M, M);

  var y = M + 46, gridW = W - M * 2;
  D.tiers.forEach(function(t, ti){
    var h = rowHs[ti];
    c.fillStyle = "#1b1b1d"; c.fillRect(M, y, gridW, h);
    c.fillStyle = t.color;   c.fillRect(M, y, labelW, h);
    c.strokeStyle = "#000";  c.lineWidth = 1;
    c.strokeRect(M + 0.5, y + 0.5, gridW - 1, h - 1);

    var fs = longest <= 2 ? 30 : longest <= 6 ? 20 : longest <= 14 ? 16 : 14;
    c.font = "800 " + fs + "px " + FONT;
    c.fillStyle = "#151515";
    var lines = wrapLines(c, t.name, labelW - 14, 4);
    var ly = y + (h - lines.length * (fs + 3)) / 2;
    lines.forEach(function(line){
      c.fillText(line, M + labelW / 2 - c.measureText(line).width / 2, ly);
      ly += fs + 3;
    });

    place.rows[ti].forEach(function(idx, k){
      var cx = M + labelW + PAD + (k % cols) * (CELL + GAP);
      var cy = y + PAD + Math.floor(k / cols) * (CELL + capH + GAP);
      c.fillStyle = "#000"; c.fillRect(cx, cy, CELL, CELL + capH);
      var im = imgs[idx];
      if (im && im.naturalWidth){
        var sc = Math.min(CELL / im.naturalWidth, CELL / im.naturalHeight);
        var iw = im.naturalWidth * sc, ih = im.naturalHeight * sc;
        c.drawImage(im, cx + (CELL - iw) / 2, cy + (CELL - ih) / 2, iw, ih);
      }
      var cap = D.items[idx].caption;
      if (cap){
        var cfs = Math.max(9, Math.round(CELL / 10));
        c.font = cfs + "px " + FONT;
        c.fillStyle = "#dcdce0";
        var cl = wrapLines(c, cap, CELL - 4, 2);
        var ty = cy + CELL + Math.max(1, (capH - cl.length * (cfs + 2)) / 2);
        cl.forEach(function(line){
          c.fillText(line, cx + CELL / 2 - c.measureText(line).width / 2, ty);
          ty += cfs + 2;
        });
      }
      c.strokeStyle = "#2c2c31";
      c.strokeRect(cx + 0.5, cy + 0.5, CELL - 1, CELL + capH - 1);
    });
    y += h;
  });

  if (creditLines.length){
    y += 14;
    c.font = "700 11px " + FONT; c.fillStyle = "#8b8b90";
    c.fillText("IMAGE CREDITS", M, y); y += 16;
    c.font = "12px " + FONT;
    creditLines.forEach(function(line){ c.fillText(line, M, y); y += 15; });
  }
  return cv;
}

function fileName(){
  var base = (D.title || "tier-list").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  return (base || "tier-list") + ".png";
}
function dataUrlToBlob(u){
  var bin = atob(u.split(",")[1]), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: "image/png" });
}
function handOver(blob){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  var left = place.queue.length;
  toast("Saved " + fileName() + (left ? " — " + left + " item" + (left === 1 ? " is" : "s are") +
        " still unranked, so not in the picture." : "."), left ? 6000 : 3500);
}

byId("saveBtn").addEventListener("click", function(){
  var btn = byId("saveBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  toast("Drawing the picture…", 30000);
  loadImages().then(function(imgs){
    var cv = drawList(imgs);
    var done = function(){ btn.disabled = false; };
    if (cv.toBlob) cv.toBlob(function(blob){
      handOver(blob || dataUrlToBlob(cv.toDataURL("image/png")));
      done();
    }, "image/png");
    else { handOver(dataUrlToBlob(cv.toDataURL("image/png"))); done(); }
  }).catch(function(){
    byId("saveBtn").disabled = false;
    toast("Something went wrong drawing the picture.", 5000);
  });
});

byId("resetBtn").addEventListener("click", function(){
  if (!confirm("Put every item back in the unranked queue?")) return;
  place = { rows: D.tiers.map(function(){ return []; }), queue: D.items.map(function(_, i){ return i; }) };
  save(); render();
});

/* ---- go ---- */
document.title = D.title;
byId("title").textContent = D.title;
resize();
render();
var rt = null;
window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ resize(); }, 120); });
})();</script>
