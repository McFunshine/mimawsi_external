<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fruit Machine</title>
<style>
:root{
  --bg:#14131a; --panel:#1d1c26; --line:#312f3f; --ink:#ece9f5; --dim:#918cab;
  --hot:#e4384f; --cool:#49c5b1; --gold:#f2b134; --ok:#5fd68a; --bad:#ff6b7f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(228,56,79,.10),transparent 45%),
                   radial-gradient(circle at 88% 92%,rgba(73,197,177,.08),transparent 45%);
}
#app{max-width:1100px;margin:0 auto;padding:20px 18px 64px}
header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
h1{
  font-family:var(--mono);font-size:1.45rem;margin:0;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;
}
h1 .mark{color:var(--hot)}
.sub{color:var(--dim);font-size:.9rem;margin-top:4px}
h2{font-family:var(--mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
   color:var(--dim);margin:22px 0 8px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:4px;font-family:var(--mono);
      letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{
  width:100%;background:#131219;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:.9rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cool);outline-offset:1px;border-color:transparent}
button{
  background:var(--hot);color:#fff;border:0;border-radius:7px;padding:9px 16px;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.cool{background:var(--cool);color:#06211d}
button.small{padding:5px 10px;font-size:.72rem}
.note{color:var(--dim);font-size:.82rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .gold{color:var(--gold)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.scroll{overflow-x:auto}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:.78rem}
@media (max-width:620px){#app{padding:14px 12px 48px}h1{font-size:1.15rem}}@media (hover:none){input,textarea,select{font-size:16px}}

.cab{background:linear-gradient(#2a2734,#1a1922);border:1px solid var(--line);border-radius:14px;
  padding:18px;max-width:440px}
.reels{display:flex;gap:10px;justify-content:center}
.reel{flex:1;background:#f4f1e8;border-radius:9px;height:104px;overflow:hidden;position:relative;
  display:grid;place-items:center;border:2px solid #b9b2a3}
.reel .sym{font-size:2.6rem;line-height:1;user-select:none}
.reel .pic{width:80%;height:80%;object-fit:contain;display:block;pointer-events:none}
.reel.spin .sym,.reel.spin .pic{animation:rollit .09s linear infinite}
@keyframes rollit{0%{transform:translateY(-14px);opacity:.45}100%{transform:translateY(14px);opacity:.45}}
.reel.held{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,177,52,.35)}
.holds{display:flex;gap:10px;justify-content:center;margin-top:8px}
.holds button{flex:1;font-size:.68rem;padding:6px 0}
.credits{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.82rem;
  color:var(--gold);margin-bottom:10px;letter-spacing:.08em}
.payline{text-align:center;font-family:var(--mono);font-size:.82rem;color:var(--dim);min-height:1.4em;margin-top:10px}
.paytable{font-size:.8rem}
.paytable .trio{white-space:nowrap;display:flex;gap:3px;align-items:center}
.paytable .trio .pic{width:30px;height:30px;object-fit:contain}
.paytable .trio .sym{font-size:1.4rem;line-height:1}
.nudge{color:var(--cool)}
</style>
</head>
<body>
<div id="app">
<header><h1><span class="mark">◆</span> Fruit Machine</h1>
<div class="sub">Hold, nudge, spin</div></header>

<div class="panel">
  <div class="cab">
    <div class="credits"><span>credits <b id="credits">0</b></span><span id="nudges"></span></div>
    <div class="reels" id="reels"></div>
    <div class="holds" id="holds"></div>
    <div class="payline" id="payline"></div>
  </div>
  <div class="row" style="margin-top:14px">
    <button id="spin">Spin</button>
    <button id="nudgeBtn" class="ghost hidden">Nudge</button>
    <span class="note" id="status"></span>
  </div>
</div>
<div class="panel">
  <h2>What pays</h2>
  <table class="paytable"><tbody id="pay"></tbody></table>
</div>

<footer>One file. Works offline, forever. Nothing is sent anywhere.</footer>
</div>

  set(v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} } }; }

const AudioKit = (() => {
  let ctx = null;
  const NOTES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

  function ac(){
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** "A4" | "F#3" -> Hz. Returns 0 for a rest. */
  function freq(note){
    if (!note || note === 'r' || note === 'R') return 0;
    const m = String(note).match(/^([A-Ga-g])([#b]?)(-?\d)$/);
    if (!m) return 0;
    const semi = NOTES[m[1].toUpperCase() + m[2]];
    if (semi === undefined) return 0;
    return 440 * Math.pow(2, (semi - 9) / 12 + (Number(m[3]) - 4));
  }

  /** One note. type: square | triangle | sawtooth | sine */
  function beep(note, dur, opts){
    const c = ac(); if (!c) return;
    const o = opts || {};
    const f = typeof note === 'number' ? note : freq(note);
    if (!f) return;
    const t = c.currentTime;
    const d = dur || 0.18;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    // A short attack and an exponential tail: without the ramp every note clicks.
    const peak = (o.gain === undefined ? 0.16 : o.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + d + 0.02);
  }

  /** Percussion, from filtered noise — no samples exist to load. */
  function hit(kind){
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = kind === 'snare' ? 0.16 : 0.07;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = kind === 'snare' ? 'highpass' : 'lowpass';
    f.frequency.value = kind === 'snare' ? 1200 : 400;
    const g = c.createGain(); g.gain.value = 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  }

  /**
   * A tune is a compact string: "E4:q G4:q B4:h r:q".
   * Durations: w h q e s (whole..sixteenth), default q.
   * Returns a handle so a caller can stop it.
   */
  function parse(src){
    return String(src).trim().split(/\s+/).filter(Boolean).map(tok => {
      const [n, d] = tok.split(':');
      const beats = {w:4, h:2, q:1, e:0.5, s:0.25}[d || 'q'] || 1;
      return { note: n, beats };
    });
  }

  function playTune(src, opts){
    const c = ac(); if (!c) return { stop(){} };
    const o = opts || {};
    const bpm = o.bpm || 132;
    const spb = 60 / bpm;
    const seq = typeof src === 'string' ? parse(src) : src;
    let at = 0;
    const timers = [];
    seq.forEach(step => {
      const ms = at * spb * 1000;
      timers.push(setTimeout(() => {
        beep(step.note, step.beats * spb * 0.92, { type: o.type || 'square', gain: o.gain });
        if (o.drums && step.note !== 'r') hit('kick');
      }, ms));
      at += step.beats;
    });
    if (o.onEnd) timers.push(setTimeout(o.onEnd, at * spb * 1000 + 60));
    return { stop(){ timers.forEach(clearTimeout); }, duration: at * spb };
  }

  /** Small UI voices, so feedback is audible without being a tune. */
  const sfx = {
    good(){ beep('E5', .09); setTimeout(() => beep('B5', .14), 90); },
    bad(){ beep('A3', .1, {type:'sawtooth'}); setTimeout(() => beep('D#3', .2, {type:'sawtooth'}), 95); },
    click(){ beep('C6', .04, {gain:.07}); },
    win(){ ['C5','E5','G5','C6'].forEach((n,i) => setTimeout(() => beep(n, .2), i * 110)); }
  };

  return { beep, hit, playTune, parse, freq, sfx, ready: () => !!ac() };
})();


const purse = store('fruit:' + DATA.title);
let credits = purse.get(DATA.start || 20);
let reels = [0, 0, 0];
let held = [false, false, false];
const MAX_HOLD = 2;  // holding all three would repay a winning line forever
let nudges = 0;
let spinning = false;
const S = DATA.symbols;

/** A symbol is either a picture or a glyph; everything downstream just asks for its face. */
function face(s){
  return s.img
    ? '<img class="pic" src="' + esc(s.img) + '" alt="' + esc(s.name) + '">'
    : '<span class="sym">' + esc(s.sym) + '</span>';
}

function atHoldLimit(){ return held.filter(Boolean).length >= MAX_HOLD; }

function draw(){
  const box = $('#reels');
  box.replaceChildren();
  reels.forEach((idx, i) => {
    const d = document.createElement('div');
    d.className = 'reel' + (held[i] ? ' held' : '') + (spinning && !held[i] ? ' spin' : '');
    d.innerHTML = face(S[idx]);
    box.appendChild(d);
  });
  const h = $('#holds');
  h.replaceChildren();
  reels.forEach((_, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = held[i] ? 'cool' : 'ghost';
    b.textContent = held[i] ? 'HELD' : 'HOLD';
    b.disabled = spinning || (!held[i] && atHoldLimit());
    b.title = (!spinning && !held[i] && atHoldLimit()) ? 'Two reels is the most you can hold.' : '';
    b.addEventListener('click', () => {
      if (!held[i] && atHoldLimit()) return;
      held[i] = !held[i];
      draw();
    });
    h.appendChild(b);
  });
  $('#credits').textContent = credits;
  $('#nudges').textContent = nudges ? nudges + ' nudge' + (nudges > 1 ? 's' : '')
    : (atHoldLimit() && !spinning ? 'hold limit ' + MAX_HOLD : '');
  $('#nudgeBtn').classList.toggle('hidden', nudges === 0 || spinning);
}

function weightedPick(){
  const total = S.reduce((a, s) => a + s.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < S.length; i++){ r -= S[i].weight; if (r <= 0) return i; }
  return S.length - 1;
}

/** Reels are compared by index, so two symbols may share a face without paying out together. */
function pairIndex(){
  const [a, b, c] = reels;
  if (a === b) return a;
  if (b === c) return b;
  if (a === c) return a;
  return -1;
}

function payout(){
  const [a, b, c] = reels;
  if (a === b && b === c){
    const win = S[a].pays;
    credits += win;
    $('#payline').textContent = 'Three ' + S[a].name + ' — ' + win + ' credits';
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.win();
    return;
  }
  const two = pairIndex();
  if (two >= 0){
    credits += 1;
    $('#payline').textContent = 'Two ' + S[two].name + ' — 1 credit back';
    // A near miss is exactly when a nudge is worth having.
    if (Math.random() < 0.34){ nudges = 1 + Math.floor(Math.random() * 2); }
    if (typeof AudioKit !== 'undefined') AudioKit.sfx.good();
    return;
  }
  $('#payline').textContent = 'Nothing.';
}

$('#spin').addEventListener('click', () => {
  if (spinning) return;
  if (credits <= 0){ $('#status').textContent = 'Out of credits. Reload for more.'; return; }
  credits--; nudges = 0;
  spinning = true;
  $('#payline').textContent = '';
  $('#status').textContent = '';
  draw();
  if (typeof AudioKit !== 'undefined') AudioKit.beep('C5', .05, { gain: .08 });
  let ticks = 0;
  const iv = setInterval(() => {
    reels = reels.map((r, i) => held[i] ? r : weightedPick());
    draw();
    if (typeof AudioKit !== 'undefined' && ticks % 3 === 0) AudioKit.sfx.click();
    if (++ticks > 11){
      clearInterval(iv);
      spinning = false;
      held = [false, false, false];
      payout();
      purse.set(credits);
      draw();
    }
  }, 95);
});

$('#nudgeBtn').addEventListener('click', () => {
  if (!nudges || spinning) return;
  nudges--;
  // Nudge the one reel that is spoiling the line.
  const two = pairIndex();
  let idx = two < 0 ? 0 : reels.findIndex(r => r !== two);
  if (idx < 0) idx = 0;
  reels[idx] = (reels[idx] + 1) % S.length;
  if (typeof AudioKit !== 'undefined') AudioKit.beep('E5', .1);
  payout();
  purse.set(credits);
  draw();
});

const pay = $('#pay');
S.slice().sort((a, b) => b.pays - a.pays).forEach(s => {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td><div class="trio">' + face(s) + face(s) + face(s) + '</div></td>'
    + '<td>' + esc(s.name) + '</td><td class="gold">' + s.pays + '</td>';
  pay.appendChild(tr);
});
draw();

</script>
